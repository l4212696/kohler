<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kohler Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#00ff66;--b:#07090d;--gold:#e8c46a;--win:#00ff66;--txt:#eef2f8;--dim:#93a0b5;--line:rgba(255,255,255,.1);--panel:rgba(8,10,16,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font:14px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 600px at 50% 0%,color-mix(in srgb,var(--a) 34%,transparent),transparent 70%),linear-gradient(180deg,var(--b),#05060a);display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top .t{font-family:Unbounded,sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:11.5px;color:var(--dim)}
.grow{flex:1}
.chipbtn.on{color:#03140a;background:var(--win);border-color:transparent}
.chipbtn{white-space:nowrap;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px;font-weight:600}
.bal{font-weight:800;font-size:15px}
.bal.up{color:var(--win);text-shadow:0 0 14px rgba(0,255,102,.6)}
.demo{font-size:11px;font-weight:700;color:#0b0d12;background:var(--gold);padding:3px 8px;border-radius:6px}
.stage{flex:1;display:grid;place-items:center;position:relative;min-height:0;padding:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.bet{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:4px}
.bet button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.07);font-weight:800;font-size:16px}
.bet input{width:84px;text-align:center;background:none;border:0;color:var(--txt);font:700 16px Inter;outline:0}
.go{min-width:150px;height:46px;padding:0 22px;border-radius:13px;font-family:Unbounded,sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;color:#04140a;
  background:linear-gradient(180deg,#3dff8c,#00d955);box-shadow:0 8px 26px rgba(0,255,102,.32),inset 0 1px 0 rgba(255,255,255,.5)}
.go:disabled{filter:grayscale(.7);opacity:.6}
.go.alt{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;border:1px solid var(--line);font-family:Inter;font-size:14px}
.msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:5;white-space:nowrap}
.msg.on{opacity:1}.msg.err{border-color:#ff5c7a;color:#ffc2cd}
.winpop{position:absolute;inset:0;display:grid;place-items:start center;padding-top:16px;pointer-events:none;z-index:4}
body.embed #titleBox{display:none}
.losepop{position:absolute;inset:0;display:grid;place-items:start center;padding-top:16px;pointer-events:none;z-index:4}
.losepop div,.winpop div{background:rgba(7,9,13,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 22px 10px;border-radius:18px;border:1px solid rgba(255,255,255,.08)}
.losepop div{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(26px,6vw,44px);color:#ff4d6d;text-shadow:0 0 24px rgba(255,77,109,.45);animation:drop 1.5s ease forwards}
.losepop div.push{color:#cbd5e1;text-shadow:none}.losepop div.part{color:#e8c46a;text-shadow:0 0 20px rgba(232,196,106,.35)}
.losepop small{display:block;font:600 13px Inter,sans-serif;color:#cbd5e1;text-align:center;margin-top:4px;letter-spacing:0}
@keyframes drop{0%{transform:translateY(-14px) scale(.9);opacity:0}15%{transform:none;opacity:1}75%{opacity:1}100%{transform:translateY(12px);opacity:0}}
.stage.lost{animation:lostshake .38s ease}
.stage.lost:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,77,109,.22));animation:fadeout .9s ease forwards}
@keyframes lostshake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes fadeout{to{opacity:0}}
.winpop div{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(34px,9vw,64px);color:var(--win);text-shadow:0 0 30px rgba(0,255,102,.7);animation:pop 1.6s ease forwards}
@media(max-width:600px){.top .meta{display:none}#sndBtn{display:none}.top{padding:8px 10px}.top .t{font-size:13px}}
@keyframes pop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.info{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.info.on{display:flex}
.info .box{background:#0d1118;border:1px solid var(--line);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:86vh;overflow:auto}
.info h3{font-family:Unbounded,sans-serif;margin:0 0 6px;font-size:16px}
.info table{width:100%;border-collapse:collapse;font-size:13px}.info td{padding:5px 0;border-bottom:1px solid var(--line)}

/* slot */
.reels{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px;border-radius:20px;width:min(94vw,560px);
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.35));border:2px solid color-mix(in srgb,var(--a) 55%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--a) 25%,transparent),inset 0 0 30px rgba(0,0,0,.6)}
.reel{position:relative;height:calc(min(94vw,560px) / 5 * 3 - 18px);overflow:hidden;border-radius:12px;background:rgba(255,255,255,.04)}
.reel .cells{display:grid;grid-template-rows:repeat(3,1fr);height:100%}
.cell{display:grid;place-items:center;font-size:clamp(28px,7.5vw,50px);transition:transform .2s}
.cell.hit{background:radial-gradient(circle,rgba(0,255,102,.28),transparent 70%);animation:hit .6s ease 2}
@keyframes hit{50%{transform:scale(1.18)}}
.reel.spin .cells{animation:blur .09s linear infinite;filter:blur(2px)}
@keyframes blur{from{transform:translateY(-12%)}to{transform:translateY(12%)}}
.payline{position:absolute;left:12px;right:12px;top:50%;height:2px;background:color-mix(in srgb,var(--a) 60%,transparent);pointer-events:none;opacity:.5}
/* roulette */
.rl{width:min(96vw,720px)}
.rl .result{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.ball{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-family:Unbounded;font-weight:800;font-size:28px;border:3px solid var(--gold);box-shadow:0 0 30px rgba(232,196,106,.35)}
.ball.red{background:#c0233b}.ball.black{background:#151820}.ball.green{background:#0e8a4a}
.strip{display:flex;gap:6px;font-size:12px}.strip span{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700}
.board{display:grid;grid-template-columns:44px repeat(12,1fr) 44px;gap:3px;padding:8px;border-radius:14px;background:var(--felt,#0d5c33);border:2px solid rgba(232,196,106,.5)}
.board button{position:relative;height:38px;border-radius:6px;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.18)}
.board .r{background:#b3203a}.board .k{background:#14161d}.board .z{background:#0c7a40;grid-row:span 3;height:auto}
.board .o{background:rgba(0,0,0,.25)}
.board .chip{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--gold);color:#1a1200;font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.chips{display:flex;gap:6px}
.chips button{width:40px;height:40px;border-radius:50%;font-weight:800;font-size:11px;border:3px dashed rgba(255,255,255,.55)}
.chips button.on{outline:3px solid var(--win);outline-offset:2px}
/* cards */
.bj{display:flex;flex-direction:column;gap:22px;align-items:center;width:min(96vw,620px);padding:24px;border-radius:200px 200px 24px 24px;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--felt,#0e5a2f) 90%,#fff 10%),var(--felt,#0e5a2f));border:3px solid rgba(232,196,106,.55)}
.hand{display:flex;gap:-10px;min-height:104px}
.card{width:70px;height:100px;border-radius:9px;background:#fbfbf8;color:#13151b;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;margin-left:-14px;box-shadow:0 6px 14px rgba(0,0,0,.4);font-weight:800;animation:deal .3s ease}
.card:first-child{margin-left:0}.card.red{color:#c0233b}
.card .s{font-size:30px;text-align:center;line-height:1}
.card.back{background:repeating-linear-gradient(45deg,#7a1f2e 0 6px,#5c1622 6px 12px);border:3px solid #fff}
@keyframes deal{from{transform:translateY(-30px) rotate(-6deg);opacity:0}}
.lbl{font-size:12px;color:rgba(255,255,255,.75);font-weight:600;text-align:center}
/* dice */
.dice{width:min(94vw,600px);display:flex;flex-direction:column;gap:20px;align-items:center}
.roll{font-family:Unbounded;font-weight:800;font-size:clamp(48px,14vw,96px)}
.track{position:relative;width:100%;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--win) 0 var(--t),#ff4d6d var(--t) 100%)}
.track .mk{position:absolute;top:-9px;width:4px;height:32px;border-radius:2px;background:#fff;transition:left .5s cubic-bezier(.2,.9,.3,1)}
.dice input[type=range]{width:100%;accent-color:var(--win)}
.stats{display:flex;gap:10px;width:100%}.stats div{flex:1;padding:10px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.stats b{display:block;font-size:17px}.stats span{font-size:11.5px;color:var(--dim)}
canvas{max-width:100%;max-height:100%}
.wheelbox{position:relative;width:min(80vw,58vh,460px);aspect-ratio:1}
.wheelbox svg{width:100%;height:100%;transition:transform calc(2.8s * var(--spd, 1)) cubic-bezier(.12,.75,.15,1)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border:14px solid transparent;border-top:24px solid var(--gold);filter:drop-shadow(0 2px 4px #000);z-index:2}

/* coin flip */
.cf{display:flex;flex-direction:column;align-items:center;gap:22px}
.coinwrap{perspective:900px;width:min(56vw,42vh,240px);aspect-ratio:1;position:relative}
.coinwrap:after{content:"";position:absolute;left:12%;right:12%;bottom:-16%;height:12%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.6),transparent 70%);transition:transform .3s}
.coin3d{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.coin3d .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:50%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.coin3d .face svg{width:100%;height:100%}
.coin3d .tails{transform:rotateY(180deg)}
.coin3d .edge{position:absolute;inset:0;border-radius:50%;transform:translateZ(-1px);background:#8a6a1e}
.sides{display:flex;gap:10px}
.side{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px 0 8px;border-radius:16px;border:1.5px solid var(--line);background:rgba(0,0,0,.35);font-weight:700}
.side svg{width:40px;height:40px}
.side.on{border-color:var(--win);box-shadow:0 0 0 1px var(--win),0 0 22px rgba(0,255,102,.25)}
.hist{display:flex;gap:6px;min-height:28px}.hist svg{width:26px;height:26px;opacity:.9}.hist .w{outline:2px solid var(--win);border-radius:50%}
/* limbo */
.lb{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(94vw,560px)}
.lbnum{font-family:Unbounded;font-weight:800;font-size:clamp(56px,16vw,120px);letter-spacing:-.04em;line-height:1;transition:color .2s,text-shadow .2s}
.lbnum.win{color:var(--win);text-shadow:0 0 40px rgba(0,255,102,.55)}.lbnum.lose{color:#ff4d6d}
.lbtg{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.lbtg input{width:80px;background:none;border:0;color:var(--txt);font:700 16px Inter;outline:0;text-align:right}
/* rocket */
.rk{position:relative;width:min(96vw,820px);height:min(56vh,440px);border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 0 100%,color-mix(in srgb,var(--a) 22%,transparent),transparent 60%),#05070b;border:1px solid var(--line)}
.rk canvas{position:absolute;inset:0;width:100%;height:100%}
.rkm{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:Unbounded;font-weight:800;font-size:clamp(44px,11vw,92px);letter-spacing:-.04em;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.rkm.boom{color:#ff4d6d}.rkm.cash{color:var(--win);text-shadow:0 0 40px rgba(0,255,102,.55)}
.rksub{position:absolute;left:50%;top:calc(38% + 52px);transform:translateX(-50%);color:var(--dim);font-weight:600;white-space:nowrap}
.rkh{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.rkh span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.07)}
.rkh span.g{color:var(--win)}.rkh span.r{color:#ff8fa3}
.go.cash{background:linear-gradient(180deg,#f3d58a,#c99a35);color:#241800;box-shadow:0 8px 26px rgba(232,196,106,.35)}
/* keno boss */
.kn{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(96vw,620px)}
.kgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;width:100%}
.kt{aspect-ratio:1;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#232c3b,#161d28);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
  font:800 clamp(13px,3.4vw,18px) Unbounded,sans-serif;color:#c9d1de;display:grid;place-items:center;transition:transform .12s,background .15s,border-color .15s;position:relative}
.kt:not(:disabled):hover{transform:translateY(-2px);background:linear-gradient(180deg,#2b3648,#1c2431)}
.kt.pick{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 34%,#1b2230),color-mix(in srgb,var(--a) 16%,#10151e));border-color:color-mix(in srgb,var(--a) 75%,transparent);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--a) 30%,transparent)}
.kt.drawn{border-color:rgba(255,255,255,.35);color:#fff}
.kt.drawn:after{content:"";position:absolute;inset:18%;border-radius:50%;border:2px solid rgba(255,255,255,.45);animation:kpop .25s ease}
.kt.hit{background:radial-gradient(circle at 35% 30%,#fff6cf,#f5c542 45%,#a87410);color:#2a1a00;border-color:#ffe08a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 26px rgba(245,197,66,.55);animation:kpop .3s cubic-bezier(.2,1.6,.4,1)}
.kt.hit:after{display:none}
.kn.done .kt:not(.pick):not(.drawn){opacity:.45}
.kt:disabled{cursor:default}
@keyframes kpop{from{transform:scale(.6)}}
.ktop{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--a);color:#1a1003}
.kpay{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
.kpay::-webkit-scrollbar{display:none}
.kpay span{flex:1 0 auto;min-width:54px;text-align:center;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;color:var(--dim)}
.kpay span b{display:block;font:800 13px Unbounded,sans-serif;color:var(--txt)}
.kpay span.z b{color:var(--dim);font-weight:600}
.kpay span.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 22%,transparent)}
.kpay span.on b{color:#fff}
/* mines */
.mn{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,56vh,460px)}
.tile{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#232c3b,#171e29);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .12s,background .2s}
.tile:not(:disabled):hover{transform:translateY(-2px);background:linear-gradient(180deg,#2b3648,#1c2431)}
.tile:disabled{cursor:default}
.tile.gem{background:radial-gradient(circle,color-mix(in srgb,var(--a) 35%,#0b0f16),#0b0f16);border-color:color-mix(in srgb,var(--a) 60%,transparent);animation:flipin .3s ease}
.tile.bomb{background:radial-gradient(circle,#5c1020,#1a0509);border-color:#ff4d6d;animation:shake .4s}
.tile.ghost{opacity:.45}
.tile svg{width:60%;height:60%}
@keyframes flipin{from{transform:rotateY(90deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sel{height:46px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt);padding:0 10px;font:600 14px Inter}
</style>
<script src="/assets/brand.js"></script>
</head>
<body>
<div class="top">
  <div style="min-width:0" id="titleBox"><div class="t" id="name">Loading…</div><div class="meta" id="meta"></div></div>
  <div class="grow"></div>
  <span class="demo" id="demoTag" hidden>DEMO</span>
  <button class="chipbtn" id="infoBtn">Rules</button>
  <button class="chipbtn" id="turboBtn" title="Shorter animations" aria-pressed="false">Turbo</button>
  <button class="chipbtn" id="sndBtn">Sound on</button>
  <div style="text-align:right"><div class="meta">Balance</div><div class="bal num" id="bal">—</div></div>
</div>
<div class="stage" id="stage"><div class="meta">Connecting to the wallet…</div></div>
<div class="bar" id="bar"></div>
<div class="msg" id="msg"></div>
<div class="info" id="info"><div class="box" id="infoBox"></div></div>

<script>
const $ = (s) => document.querySelector(s);
if (window.top !== window) document.body.classList.add('embed');
const gameId = new URLSearchParams(location.search).get('g') || decodeURIComponent(location.pathname.split('/').pop());
const hp = new URLSearchParams(location.hash.slice(1));
const token = hp.get('token'); const isDemo = hp.get('demo') === '1' || !token;
const demoId = isDemo ? (sessionStorage.getItem('ks-demo') || (() => { const v = 'demo-' + crypto.getRandomValues(new Uint32Array(2)).join(''); sessionStorage.setItem('ks-demo', v); return v; })()) : null;
let G, balance = null, busy = false, sound = true;
// Turbo: every animation runs at roughly half length. Remembered on this device.
let turbo = false; try { turbo = localStorage.getItem('ks-turbo') === '1'; } catch {}
const T = (ms) => Math.round(ms * (turbo ? 0.45 : 1));
const applyTurbo = () => { document.documentElement.style.setProperty('--spd', turbo ? '.45' : '1'); const b = document.getElementById('turboBtn'); if (b) { b.classList.toggle('on', turbo); b.setAttribute('aria-pressed', String(turbo)); } };
const cents = (s) => Math.round(Number(s) * 100);
const usd = (c) => '$' + (c / 100).toFixed(2);

/* feel */
let ac; const tone = (f, d = .08, type = 'sine', g = .05, w = 0) => { if (!sound) return; try { ac = ac || new AudioContext(); const t = ac.currentTime + w, o = ac.createOscillator(), v = ac.createGain(); o.type = type; o.frequency.value = f; v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d); } catch {} };
const buzz = (p) => { try { navigator.vibrate?.(p); } catch {} };
const winFx = (amt, stake) => { if (amt >= bet * 3) try { parent.postMessage({ type: 'kohler-win-fx' }, location.origin); } catch {} [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .07, i * .07)); buzz([20, 40, 20, 40, 80]);
  const w = document.createElement('div'); w.className = 'winpop'; w.innerHTML = `<div class="num">+${usd(amt)}${stake ? `<small style="display:block;font:700 14px Inter,sans-serif;color:#cbd5e1;text-align:center;letter-spacing:0;text-shadow:none">${usd(amt - stake)} profit on ${usd(stake)}</small>` : ''}</div>`; $('#stage').appendChild(w); setTimeout(() => w.remove(), 1700); };
// every round ends with feedback: a win, your stake back, part of it back, or a loss
function popMsg(cls, big, small) { const w = document.createElement('div'); w.className = 'losepop'; w.innerHTML = `<div class="num ${cls}">${big}${small ? `<small>${small}</small>` : ''}</div>`; $('#stage').appendChild(w); setTimeout(() => w.remove(), 1550); }
const loseFx = (amt, label) => {
  tone(220, .16, 'triangle', .05); tone(165, .3, 'triangle', .05, .13); buzz([45]);

};
function outcome(stake, payout, label) {
  if (payout > stake) return winFx(payout, stake);
  if (payout === stake && stake > 0) { tone(440, .1, 'sine', .04); buzz(12); return popMsg('push', 'Bet back', label || 'no win, no loss'); }
  if (payout > 0) { tone(330, .12, 'triangle', .04); buzz([20]); return popMsg('part', '+' + usd(payout), `of ${usd(stake)} back`); }

}

function setBalance(b, won) {

}
async function post(path, body) {
  const r = await fetch('/studio/api/' + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
async function play(action, params) {
  const out = await post('play', { gameId, action, params, ...(isDemo ? { demo: demoId } : { token }) });
  if (out.error) {

}

let bet = 100;
function betBox() {
  return `<div class="bet"><button id="bm" aria-label="Lower bet">−</button><input id="bv" class="num" inputmode="decimal" aria-label="Bet"><button id="bp" aria-label="Raise bet">+</button></div>`;
}
function wireBet() {
  const steps = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 25000, 50000, 100000, 250000, 500000].filter((s) => s >= G.min && s <= G.max);
  bet = Math.min(Math.max(bet, G.min), G.max);
  const paint = () => ($('#bv').value = (bet / 100).toFixed(2));
  $('#bm').onclick = () => { bet = [...steps].reverse().find((s) => s < bet) ?? bet; paint(); tone(500, .03); };
  $('#bp').onclick = () => { bet = steps.find((s) => s > bet) ?? bet; paint(); tone(700, .03); };
  $('#bv').onchange = () => { const v = Math.round(Number($('#bv').value) * 100); bet = Math.min(G.max, Math.max(G.min, v || G.min)); paint(); };
  paint();
}

    },
    async cash() {
      if (busy || !this.st || this.st.done) return; busy = true; $('#go').disabled = true;
      const out = await play('cashout', { round: this.st.round }); busy = false;
      if (!out) { $('#go').disabled = false; return; }
      this.st = { ...this.st, ...out.result }; this.paint(); this.bar();
      setBalance(out.balance, out.result.payoutCents); outcome(this.st.bet, out.result.payoutCents);
    },
    rules: () => `<p class="meta">25 tiles hide the number of mines you choose. Open tiles one at a time: every gem raises the multiplier, a mine ends the round. Cash out whenever you like. Payout is 99% of the fair odds of surviving that many picks, so more mines pay more per gem.</p>`,
  },
};

/* boot */
(async () => {
  try {
    G = await fetch('/studio/api/config/' + encodeURIComponent(gameId)).then((r) => r.json());
    if (G.error) throw new Error(G.error);
    document.title = G.name + ' · Kohler Studio';
    document.documentElement.style.setProperty('--a', G.theme.a || '#00ff66');
    document.documentElement.style.setProperty('--b', G.theme.b || '#07090d');
    $('#name').textContent = G.name;
    $('#meta').textContent = `Kohler Studio · RTP ${G.rtp}%${G.volatility ? ' · ' + G.volatility + ' volatility' : ''}`;
    $('#demoTag').hidden = !isDemo;
    const s = await post('session', { gameId, ...(isDemo ? { demo: demoId } : { token }) });
    if (s.error) { $('#stage').innerHTML = `<div style="text-align:center;max-width:340px"><b>Can't start the game</b><p class="meta">${s.error}</p></div>`; return; }
    setBalance(s.balance);
    const eng = ENG[G.engine]; eng.init();
    $('#infoBtn').onclick = () => { $('#infoBox').innerHTML = `<h3>${G.name}</h3><p class="meta">Return to player ${G.rtp}%. Every result is decided on the provider's server; nothing on this page can change it.${isDemo ? ' Demo play uses pretend money.' : ''}</p>${eng.rules()}<p class="meta">Bet ${usd(G.min)} to ${usd(G.max)}.</p>`; $('#info').classList.add('on'); };
    $('#info').onclick = (e) => { if (e.target.id === 'info') $('#info').classList.remove('on'); };
  } catch (e) { $('#stage').innerHTML = `<div class="meta">${e.message}</div>`; }
})();
</script>
</body>
</html>
