<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POOLWARS — Deposit $50, Play with $100</title>
<meta name="description" content="Minimalist crypto casino. Rocket, Dice, Limbo, Mines, Plinko, Wheel. Instant 2x first deposit. Provably fair.">
<meta name="theme-color" content="#0a0d14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--bg2:#0f131d;--card:#141a27;--card2:#1b2233;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--text:#eef1f7;--muted:#8a93a8;--green:#22e58a;--green2:#12b86a;--red:#ff4d6d;--gold:#ffc043;--blue:#3ad1ff;--purple:#7c5cff;--r:16px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}
.sm{font-size:12px}.xs{font-size:11px}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.center{text-align:center}
.wide{width:100%}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(10,13,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.08em;font-size:19px;cursor:pointer;user-select:none}
.logo b{background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.tb-right{display:flex;align-items:center;gap:10px}
.balance{display:flex;flex-direction:column;align-items:flex-end;padding:6px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;min-width:120px;transition:border-color .15s}
.balance:hover{border-color:var(--line2)}
.bal-main{font-family:var(--mono);font-weight:800;font-size:16px;line-height:1.1}
.bal-sub{font-size:10.5px;color:var(--muted);white-space:nowrap}
.bal-main.bump{animation:bump .4s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12);color:var(--green)}100%{transform:scale(1)}}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.icon-btn:hover{border-color:var(--line2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line);transition:transform .08s,filter .15s,box-shadow .15s;white-space:nowrap;user-select:none}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(135deg,var(--purple),var(--blue));border-color:transparent;color:#fff}
.btn.green{background:var(--green);color:#052113;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#ffd166,#ffab2e);color:#3a2300;border-color:transparent}
.btn.red{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{padding:16px 18px;font-size:17px;border-radius:14px;font-weight:800;letter-spacing:.01em}
.btn.deposit{background:var(--green);color:#052113;border-color:transparent;font-weight:800;box-shadow:0 0 22px rgba(34,229,138,.35);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(34,229,138,.25)}50%{box-shadow:0 0 30px rgba(34,229,138,.55)}}
.btn.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.mini{padding:7px 10px;border-radius:9px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.mini:hover{border-color:var(--line2)}
.mini.on{background:rgba(124,92,255,.25);border-color:var(--purple)}
.chip{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.chip:hover{border-color:var(--line2)}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-title{font-weight:800;font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:800;font-size:16px}
.lobby-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:900px){.lobby-grid{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tag.green{background:rgba(34,229,138,.12);color:var(--green);border-color:rgba(34,229,138,.3)}
.tag.gold{background:rgba(255,192,67,.12);color:var(--gold);border-color:rgba(255,192,67,.3)}
.tag.red{background:rgba(255,77,109,.12);color:var(--red);border-color:rgba(255,77,109,.3)}
.tag.purple{background:rgba(124,92,255,.15);color:#b7a6ff;border-color:rgba(124,92,255,.4)}
.demo-badge{font-size:10px;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line2);padding:2px 6px;border-radius:6px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:36px 30px;background:radial-gradient(900px 380px at 5% -10%,rgba(124,92,255,.38),transparent 60%),radial-gradient(700px 300px at 95% 110%,rgba(58,209,255,.22),transparent 60%),var(--card);border:1px solid var(--line)}
.hero h1{font-size:clamp(30px,5.4vw,58px);font-weight:900;letter-spacing:-.025em;line-height:1}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{color:var(--muted);margin-top:12px;font-size:15px;max-width:520px}
.hero .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero .bullets{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;font-size:13px;color:var(--muted)}
.hero .rocket-bg{position:absolute;right:-10px;bottom:-30px;font-size:180px;opacity:.12;transform:rotate(-20deg);pointer-events:none}
.signin{display:flex;gap:8px;max-width:440px;margin-top:20px}
.signin input{flex:1}
.input{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);outline:none;font-size:15px;transition:border-color .15s}
.input:focus{border-color:var(--purple)}
.input.mono{font-size:14px}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.field{margin-bottom:12px}

/* ---------- banner ---------- */
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-radius:18px;background:linear-gradient(120deg,rgba(34,229,138,.16),rgba(124,92,255,.14)),var(--card);border:1px solid rgba(34,229,138,.28);cursor:pointer;flex-wrap:wrap}
.banner h2{font-size:clamp(18px,3vw,26px);font-weight:900;letter-spacing:-.01em}
.banner h2 em{font-style:normal;color:var(--green)}
.banner .cd{font-family:var(--mono);font-weight:700;color:var(--gold)}
.banner.break{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.35);cursor:default}

/* ---------- games grid ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{--acc:var(--purple);position:relative;aspect-ratio:1/1.05;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:auto -30% -50% auto;width:80%;aspect-ratio:1;border-radius:50%;background:var(--acc);opacity:.16;filter:blur(30px);transition:opacity .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.tile:hover::before{opacity:.3}
.tile .ico{font-size:40px;line-height:1}
.tile .t-name{font-weight:800;font-size:16px}
.tile .t-tag{font-size:12px;color:var(--muted)}
.tile .t-edge{position:absolute;top:12px;right:12px}
.tile.featured{grid-column:1/-1;aspect-ratio:auto;min-height:150px;flex-direction:row;align-items:center;gap:22px;background:linear-gradient(120deg,rgba(124,92,255,.22),rgba(58,209,255,.06)),var(--card)}
.tile.featured .ico{font-size:64px}
.tile.featured .t-name{font-size:24px}
.tile.featured .live{margin-left:auto;text-align:right;padding-top:12px}
.tile.featured .live .m{font-family:var(--mono);font-weight:800;font-size:44px;line-height:1}
.tile.featured .live .m.crashed{color:var(--red)}
.tile.featured .live .m.flying{color:var(--green)}

/* ---------- progress ---------- */
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green2),var(--green));transition:width .4s ease}
.progress.gold>i{background:linear-gradient(90deg,#c98a12,var(--gold))}
.progress.purple>i{background:linear-gradient(90deg,var(--purple),var(--blue))}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono)}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:hidden}
.feed-item{display:grid;grid-template-columns:1.2fr .9fr .7fr .9fr;gap:8px;align-items:center;font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);animation:slideDown .3s ease}
.feed-item .p{font-family:var(--mono);font-weight:700;text-align:right}
.feed-item.big{border-color:rgba(255,192,67,.5);background:rgba(255,192,67,.07)}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.lb{width:100%;border-collapse:collapse;font-size:13px}
.lb td{padding:8px 6px;border-bottom:1px solid var(--line)}
.lb tr:last-child td{border-bottom:0}
.lb tr.me td{color:var(--green);font-weight:700}
.lb .rank{width:28px;color:var(--muted);font-family:var(--mono)}
.lb .amt{text-align:right;font-family:var(--mono);font-weight:700}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.tab{flex:1;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.tab.active{background:var(--card2);color:var(--text)}

/* ---------- modals ---------- */
.modal-layer{position:fixed;inset:0;z-index:80;background:rgba(3,5,9,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:22px;padding:24px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(720px,100%)}
.modal h3{font-size:20px;font-weight:900;letter-spacing:-.01em;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;transition:border-color .1s}
.preset b{display:block;font-family:var(--mono);font-size:16px}
.preset span{font-size:11px;color:var(--green)}
.preset.on{border-color:var(--green);background:rgba(34,229,138,.1)}
.bonus-preview{margin-top:14px;padding:14px;border-radius:14px;background:rgba(34,229,138,.08);border:1px solid rgba(34,229,138,.25);display:flex;justify-content:space-between;align-items:center}
.bonus-preview .big{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--green)}
.method{display:flex;gap:8px}
.method .m{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;font-size:13px}
.method .m small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.method .m.on{border-color:var(--purple);background:rgba(124,92,255,.12)}
.qr{width:180px;height:180px;border-radius:14px;background:#fff;padding:8px;margin:0 auto;display:grid;place-items:center;color:#000;font-size:11px;text-align:center}
.qr img{width:100%;height:100%}
.copy-row{display:flex;gap:8px;align-items:center;margin-top:12px}
.copy-row .input{font-size:12px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.celebrate{text-align:center;padding:10px 0}
.celebrate .amt{font-family:var(--mono);font-size:56px;font-weight:800;color:var(--green);line-height:1;margin:14px 0 6px;animation:bump .6s ease}
.sheet{position:fixed;top:64px;right:12px;z-index:90;width:260px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .15s ease-out}
.sheet button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600}
.sheet button:hover{background:var(--card2)}
.sheet hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.hist-list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto}
.hist-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 12px;border-radius:10px;background:var(--card);font-size:13px}
.hist-row .t{color:var(--muted);font-size:11px}
.hist-row .n{font-family:var(--mono);font-weight:700;text-align:right}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:10px;width:min(370px,calc(100vw - 28px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;background:#171e2e;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.45);animation:slideIn .28s cubic-bezier(.2,.9,.3,1.1)}
.toast.win{border-color:rgba(34,229,138,.45)}.toast.gift{border-color:rgba(255,192,67,.5)}
.toast .ti{font-size:22px;line-height:1}
.toast .tt{font-weight:800;font-size:13.5px}
.toast .tb{font-size:12.5px;color:var(--muted);margin-top:2px}
.toast .ta{margin-top:8px;display:flex;gap:8px}
.toast .tx{margin-left:auto;color:var(--muted);font-size:14px;padding:0 2px}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.out{animation:fadeOut .25s forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- game layer ---------- */
.game-layer{position:fixed;inset:0;z-index:60;background:rgba(5,7,12,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px}
.game-shell{width:min(1120px,100%);height:min(780px,100%);background:var(--bg2);border:1px solid var(--line2);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease-out}
.game-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.game-head .gt{font-weight:900;font-size:17px;display:flex;align-items:center;gap:10px}
.game-body{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
.g-controls{padding:16px;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.g-stage{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:820px){.game-layer{padding:0}.game-shell{border-radius:0;height:100%}.game-body{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto;overflow:auto}.g-stage{order:-1;min-height:300px}.g-controls{border-right:0;border-top:1px solid var(--line);max-height:none;overflow:visible}}
.bet-panel .amt-row{display:flex;gap:6px;align-items:center}
.bet-panel .amt-wrap{position:relative;flex:1}
.bet-panel .amt-wrap .cur{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.bet-panel .amt-wrap input{padding-left:26px;font-family:var(--mono);font-weight:700}
.bet-panel .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat3 div{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.stat3 span{display:block;font-size:11px;color:var(--muted)}
.stat3 b{font-family:var(--mono);font-size:14px}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.seg button.on.g{color:var(--green)}.seg button.on.r{color:var(--red)}
.hist-chips{display:flex;gap:6px;flex-wrap:wrap}
.hist-chips span{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--card)}
.hist-chips .lo{color:var(--muted)}.hist-chips .mid{color:var(--green);background:rgba(34,229,138,.12)}.hist-chips .hi{color:var(--gold);background:rgba(255,192,67,.14)}
.hist-chips .win{color:var(--green);background:rgba(34,229,138,.12)}.hist-chips .lose{color:var(--red);background:rgba(255,77,109,.12)}
.players{display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:260px;overflow:auto}
.players div{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 10px;border-radius:8px;background:var(--card)}
.players div.me{border:1px solid var(--purple)}
.players .c{font-family:var(--mono);font-weight:700}
.result{position:absolute;left:50%;top:14%;transform:translate(-50%,0);padding:12px 22px;border-radius:16px;font-family:var(--mono);font-weight:800;font-size:26px;pointer-events:none;animation:pop .25s;z-index:5;white-space:nowrap}
.result.win{background:rgba(34,229,138,.16);color:var(--green);border:2px solid var(--green);box-shadow:0 0 40px rgba(34,229,138,.3)}
.result.lose{background:rgba(255,77,109,.16);color:var(--red);border:2px solid var(--red)}
.result.fade{animation:fadeOut .4s forwards}
canvas.stage{width:100%;height:100%;display:block}
.stage-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.auto-panel{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.auto-panel .input{padding:9px 12px;font-size:13px}

'use strict';
/* ═══════════════════════════════════════════════════════════════════════════

/* ───────────── utils ───────────── */
const $ = (s, r = document) => r.querySelector(s);

/* ───────────── SHA-256 / HMAC (pure JS so provably-fair works even from file://) ───────────── */
const SHA256 = (() => {

/* ───────────── provably fair ───────────── */
const Fair = {
  init() { const f = state.fair; if (!f.serverSeed) { f.serverSeed = hex(crypto.getRandomValues(new Uint8Array(32))); f.serverSeedHash = SHA256.hash(f.serverSeed); f.nonce = 0; } if (!f.clientSeed) f.clientSeed = hex(crypto.getRandomValues(new Uint8Array(8))); },
  rotate(newClientSeed) {

    f.serverSeed = hex(crypto.getRandomValues(new Uint8Array(32))); f.serverSeedHash = SHA256.hash(f.serverSeed); f.nonce = 0;
    if (newClientSeed) f.clientSeed = newClientSeed; save();

  floats(game, count = 1) { const f = state.fair; f.nonce += 1; save(); return { nonce: f.nonce, floats: Fair.derive(f.serverSeed, f.clientSeed, f.nonce, game, count) }; },
  derive(serverSeed, clientSeed, nonce, game, count) {

    return out;
  },

  crashPoint: r => clamp(Math.floor((0.99 / (1 - r)) * 100) / 100, 1, CONFIG.rocket.maxMultiplier),
  limboResult: r => clamp(Math.floor((0.99 / (1 - r)) * 100) / 100, 1, 1e6),

/* ───────────── wallet: deposits, sticky bonus, wagering unlock, settlement, loss-back ───────────── */
const Wallet = {

  firstDepositTimeLeft() { return state.user ? Math.max(0, state.user.createdAt + CONFIG.firstDepositWindowMs - Date.now()) : 0; },

  bonusOffer() {

    if (new Date().getDay() === 0) best = { pct: CONFIG.reload.sunday, label: 'Sunday reload +50%', key: 'sunday' };

  },
  todayDeposited() { const t = dayKey(); return r2(state.history.filter(h => h.type === 'deposit' && dayKey(new Date(h.t)) === t).reduce((a, h) => a + h.amount, 0)); },
  depositBlocked(amount) {

/* ───────────── deposits (pending → poll → credit → celebrate) ───────────── */
const Deposits = {
  timer: 0,
  async create(amount, method) {

  },

  draw() {
    if (!this.mounted) return; this.raf = requestAnimationFrame(() => this.draw());

    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }

      ctx.fillStyle = '#8a93a8'; ctx.font = '700 13px Inter, sans-serif'; ctx.fillText('NEXT LAUNCH IN', W / 2, H / 2 - 48);
      ctx.fillStyle = '#fff'; ctx.font = '800 64px "JetBrains Mono", monospace'; ctx.fillText((left / 1000).toFixed(1) + 's', W / 2, H / 2 + 16);
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(W * .25, H / 2 + 42, W * .5, 6); ctx.fillStyle = '#22e58a'; ctx.fillRect(W * .25, H / 2 + 42, W * .5 * (1 - left / CONFIG.rocket.bettingMs), 6);
      ctx.fillStyle = '#8a93a8'; ctx.font = '600 13px Inter, sans-serif'; ctx.fillText(this.myBet ? `Bet placed: ${money(this.myBet.amount)}${this.myBet.auto ? ` · auto cash out ${fmtX(this.myBet.auto)}` : ''}` : 'Place your bet', W / 2, H / 2 + 74);
      if (this.history.length) { ctx.fillStyle = '#8a93a8'; ctx.font = '600 12px Inter, sans-serif'; ctx.fillText(`Last crash ${fmtX(this.history[0])}`, W / 2, H - 16); }

      for (let i = 1; i <= N; i++) { const t = el * i / N, m = Math.min(Math.exp(CONFIG.rocket.growth * t), this.crashAt); px = lx; py = ly; lx = X(t); ly = Y(m); ctx.lineTo(lx, ly); }
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = crashed ? '#ff4d6d' : '#22e58a'; ctx.stroke();
      ctx.lineTo(lx, H - pad); ctx.lineTo(X(0), H - pad); ctx.closePath(); const fg = ctx.createLinearGradient(0, 0, 0, H); fg.addColorStop(0, crashed ? 'rgba(255,77,109,.35)' : 'rgba(34,229,138,.35)'); fg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = fg; ctx.fill();
      const ang = Math.atan2(ly - py, lx - px); ctx.save(); ctx.translate(lx, ly); ctx.rotate(crashed ? 0 : ang + Math.PI / 4); ctx.font = `${crashed ? 52 : 40}px serif`; ctx.textBaseline = 'middle'; ctx.fillText(crashed ? '💥' : '🚀', 0, 0); ctx.restore();
      ctx.textBaseline = 'alphabetic';
      if (crashed) { ctx.fillStyle = '#ff4d6d'; ctx.font = '800 18px Inter, sans-serif'; ctx.fillText('CRASHED', W / 2, H / 2 - 56); }
      ctx.fillStyle = crashed ? '#ff4d6d' : '#fff'; ctx.font = `800 ${Math.min(88, W / 6)}px "JetBrains Mono", monospace`; ctx.fillText(fmtX(this.mult), W / 2, H / 2 + 12);

    ctx.globalAlpha = 1;
  },
};

<script>
/* ═══════════════════ MINES ═══════════════════ */
const Mines = {
  id: 'mines', name: 'Mines', icon: '💣', tag: '25 tiles · find gems, dodge mines', edge: '1% edge', acc: '#ffc043',
  mines: 3, els: {},
  get game() { return state.minesGame; },
  multFor(k, mines = this.mines) { if (k <= 0) return 1; let m = 1; for (let i = 0; i < k; i++) m *= (25 - i) / (25 - mines - i); return Math.floor(m * 0.99 * 100) / 100; },
  mount({ controls, stage }) {
    this.els = { controls, stage }; if (this.game && !this.game.over) this.mines = this.game.mines;
    controls.innerHTML = `${betPanelHTML('mines')}<div class="field"><label class="lbl">Mines (1–24)</label><select class="input" id="mines-n">${Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}" ${i + 1 === this.mines ? 'selected' : ''}>${i + 1} mine${i ? 's' : ''} · ${24 - i} gems</option>`).join('')}</select></div><div class="stat3"><div><span>Gems found</span><b id="mines-g">0</b></div><div><span>Current</span><b id="mines-cur">1.00x</b></div><div><span>Next gem</span><b id="mines-next" class="green"></b></div></div><button class="btn big wide green" id="mines-btn">START</button><div class="hotkey">Space = start / cash out</div><div class="card" style="padding:12px"><div class="row between sm"><b>🏆 Daily high score</b><span class="muted">most gems, one run</span></div><div class="row between sm mt"><span>Your best today</span><b class="mono gold" id="mines-best"></b></div><div class="xs muted mt">#1 at midnight wins <b class="gold">$1,000</b>. You must cash out to lock a score.</div></div>`;
    stage.innerHTML = `<div class="stage-center"><div class="mines-grid" id="mines-grid"></div><div class="mines-info"><span>Payout now: <b id="mines-pay">—</b></span><span>Mines: <b id="mines-mm">${this.mines}</b></span></div></div>`;
    bindBetPanel(controls, 'mines');
    $('#mines-n').addEventListener('change', e => { this.mines = +e.target.value; this.update(); });
    $('#mines-amt').addEventListener('input', () => this.update());
    $('#mines-btn').addEventListener('click', () => this.primary());
    $('#mines-grid').addEventListener('click', e => { const t = e.target.closest('.mtile'); if (t) this.pick(+t.dataset.i); });
    this.update();
  },
  unmount() {},
  primary() { if (this.game && !this.game.over) { if (this.game.revealed.length) this.cashout(); } else if (!this.game) this.start(getBet('mines')); },
  start(amount) {
    if (!Wallet.canBet(amount)) { UI.needFunds(amount); return; }
    const split = Wallet.placeBet('mines', amount), { nonce, floats } = Fair.floats('mines', 24);
    state.minesGame = { bet: amount, split, mines: this.mines, minePos: Fair.minesLayout(floats, this.mines), revealed: [], nonce, over: false }; save(); Sound.click(); this.update();
  },
  pick(i) {
    const g = this.game; if (!g || g.over || g.revealed.includes(i)) return;
    if (g.minePos.includes(i)) {
      g.over = true; g.hit = i; save(); Sound.lose();
      Wallet.settle('mines', g.bet, g.split, 0, { mines: g.mines, gems: g.revealed.length, hit: i, nonce: g.nonce });
      this.update(); flashResult(this.els.stage, false, `💥 BOOM · ${money(-g.bet, true)}`); this.endSoon(); return;
    }
    g.revealed.push(i); save(); Sound.plink(g.revealed.length); this.update();
    if (g.revealed.length === 25 - g.mines) this.cashout();
  },
  cashout() {
    const g = this.game; if (!g || g.over || !g.revealed.length) return;
    const k = g.revealed.length, mult = this.multFor(k, g.mines), payout = r2(g.bet * mult); g.over = true; g.cashed = true; save();
    const res = Wallet.settle('mines', g.bet, g.split, payout, { mines: g.mines, gems: k, mult, nonce: g.nonce });
    const best = state.stats.minesBest; if (best.day !== dayKey()) { best.day = dayKey(); best.gems = 0; }
    if (k > best.gems) { best.gems = k; save(); Notify.toast({ icon: '🏆', title: `New daily best: ${k} gems`, body: 'You are on the Mines leaderboard.', kind: 'win' }); }
    Backend.logEvent({ type: 'mines_score', gems: k, mines: g.mines });
    Sound.win(); if (mult >= 5) Confetti.burst(220); flashResult(this.els.stage, true, `${money(res.net, true)} @ ${fmtX(mult)}`); this.update(); this.endSoon();
  },

  update() {
    const g = this.game, grid = $('#mines-grid'); if (!grid) return;
    const mines = g ? g.mines : this.mines, k = g ? g.revealed.length : 0, live = !!(g && !g.over);
    grid.innerHTML = Array.from({ length: 25 }, (_, i) => {
      const rev = g?.revealed.includes(i), isMine = g?.minePos.includes(i), showAll = g?.over; let cls = 'mtile', txt = '';
      if (rev) { cls += ' rev gem'; txt = '💎'; } else if (showAll && isMine) { cls += ' rev mine' + (g.hit === i ? ' boom' : ''); txt = '💣'; } else if (showAll) { cls += ' dim'; txt = '💎'; }
      return `<button class="${cls}" data-i="${i}" ${live ? '' : 'disabled'}>${txt}</button>`;
    }).join('');
    $('#mines-mm').textContent = mines; $('#mines-g').textContent = k;
    $('#mines-cur').textContent = fmtX(k ? this.multFor(k, mines) : 1); $('#mines-next').textContent = k < 25 - mines ? fmtX(this.multFor(k + 1, mines)) : '—';
    $('#mines-pay').textContent = g && k ? money(g.bet * this.multFor(k, mines)) : '—';
    const btn = $('#mines-btn'), amt = r2(+$('#mines-amt').value || CONFIG.defaultBet);
    if (live) { btn.textContent = k ? `CASH OUT · ${money(g.bet * this.multFor(k, mines))}` : 'PICK A TILE'; btn.className = 'btn big wide ' + (k ? 'gold pulse' : 'ghost'); btn.disabled = !k; }
    else { btn.textContent = `START · ${money(amt)}`; btn.className = 'btn big wide green'; btn.disabled = !!g; }
    $('#mines-n').disabled = live; $('#mines-amt').disabled = live;
    const best = state.stats.minesBest; $('#mines-best').textContent = best.day === dayKey() ? `${best.gems} gems` : '—';
  },
};
GAMES.mines = Mines;

/* ═══════════════════ PLINKO ═══════════════════ */

  unmount() { this.auto?.stop(); },

<script>

   ▸ SERVER PORT: this engine (newLobby → addPlayer → setPhase → computeResult → settle)
     is the reference state machine. Run it server-side (Redis lobby state, Socket.io
     events lobby:player_joined / lobby:countdown / lobby:resolved / balance:updated),
     keep this UI as the client and set SURVIVOR.simulateOthers = false.
   ▸ Liquidity providers (house seats) are tagged "LP" at the table and play by the
     exact same RNG. Their bankroll is recycled profit (see fundLP), never fresh capital. */
const SURVIVOR = {
  types: {
    duel:    { label: 'Duel',    icon: '⚔️', n: 2,  losers: 1, min: 5,  max: 10000, blurb: 'winner keeps 90%' },

  },

  rakeback: 0.05, rakebackStreak: 0.07, streakDays: 3,  // credits pool → loser, boosted by a 3-day play streak

  createFee: 0.5, checkin: 0.5, pendingHoldMs: 24 * 3600e3,
  lp: { maxStake: 10, seedShare: 0.2, maxWinStreak: 3, benchMs: 90e3, reserve: 500, demoReserve: 20, fundShare: 0.2 },
  systemStakes: { duel: [5, 25, 100, 1000], classic: [1, 5, 20, 100], squad: [10, 50, 1000], blitz: [1, 5, 25] },

const Survivor = {
  id: 'survivor', name: 'Survivor Pools', icon: '☠️', tag: '2–10 players stake the same · one pays the table', edge: '10% of forfeit', acc: '#ff4d6d',
  lobbies: new Map(), recent: [], lpStreak: {}, lpBench: {}, mounted: false, els: {}, view: 'browse', tab: 'trending', type: 'classic', stake: 5, raf: 0, _roomKey: '', _browseKey: '', _spot: null,
  get sv() { return state.survivor; }, get T() { return state.treasury; }, get P() { return SURVIVOR.phases; },

    else { if (this.sv.seat) { if (!this.sv.seat.practice) Wallet.refund(this.sv.seat.split); Notify.toast({ icon: '↩️', title: 'Your table closed while you were away', body: 'Stake refunded.' }); } this.sv.seat = null; this.sv.myLobby = null; save(); }

  newLobby({ type, stake, priv = false, practice = false, system = false }) {
    const t = SURVIVOR.types[type], serverSeed = hex(crypto.getRandomValues(new Uint8Array(32)));

  fakePlayer(lp) {

  lpJoin(l) {

    for (const p of l.players) if (SHA256.hash(p.seed) !== p.seedHash) return { ok: false, why: `${p.name}'s seed does not match their commitment` };

  landAt(l, r = l.losersN - 1) { const P = this.P.resolve; return l.losersN === 1 ? P * 0.55 : (r === 0 ? P * 0.4 : P * 0.8); },
  spotIndex(l, el) { for (let r = 0; r < l.losersN; r++) { const start = r === 0 ? 0 : this.landAt(l, r - 1) + 500, end = this.landAt(l, r); if (el < start) return null; if (el < end) { const p = (el - start) / (end - start), eased = 1 - Math.pow(1 - p, 3), S = l.n * 3 + l.losers[r]; return Math.floor(eased * S) % l.n; } } return null; },
  tick() {

      else if (l.status === 'commit') { if (el >= P.commit) this.setPhase(l, 'reveal'); }
      else if (l.status === 'reveal') { if (el >= P.reveal) this.setPhase(l, 'resolve'); }

  },
  bind_fair() {
    $('#fairRotate').onclick = () => { Fair.rotate($('#fairClient').value.trim() || undefined); Notify.toast({ icon: '🔁', title: 'Seed rotated', body: 'Previous server seed revealed below.' }); this.openModal('fair'); };
    $('#vGo').onclick = () => {
      const ss = $('#vServer').value.trim(), cs = $('#vClient').value.trim(), n = +$('#vNonce').value, g = $('#vGame').value; if (!ss || !cs || !n) return Notify.toast({ icon: '✋', title: 'Fill in server seed, client seed and nonce' });
      const fl = Fair.derive(ss, cs, n, g, { plinko: 16, mines: 24 }[g] || 1); let out;
      switch (g) {
        case 'rocket': out = `crash point ${fmtX(Fair.crashPoint(fl[0]))}`; break;
        case 'limbo': out = `result ${fmtX(Fair.limboResult(fl[0]))}`; break;
        case 'dice': out = `roll ${Fair.diceRoll(fl[0]).toFixed(2)}`; break;
        case 'wheel': { const i = Fair.wheelIndex(fl[0], Wheel.SEGS.length); out = `slice #${i} → ${fmtX(Wheel.SEGS[i])}`; break; }
        case 'plinko': { const p = Fair.plinkoPath(fl), s = p.reduce((a, b) => a + b, 0); out = `path ${p.map(x => x ? 'R' : 'L').join('')} → slot ${s} · low/med/high = ${['low', 'medium', 'high'].map(r => fmtX(Plinko.TABLES[r][s])).join(' / ')}`; break; }
        case 'mines': out = `shuffled tile order (first N are the mines for N mines): ${Fair.shuffle25(fl).join(', ')}`; break;
      }
      $('#vOut').innerHTML = `r = ${fl[0].toFixed(8)}<br>${esc(out)}`;
    };
  },

  /* operator: treasury + LP flywheel (admin-only in production) */
  modal_operator() {
    const T = state.treasury, S = SURVIVOR, reserve = Backend.demo ? S.lp.demoReserve : S.lp.reserve, target = r2(Math.max(0, T.profitTotal - reserve) * S.lp.fundShare), pnl = r2(T.lpBankroll - T.lpFunded);
    return `<h3>Operator · treasury & LP flywheel</h3><div class="sub">${Backend.demo ? 'Numbers from the simulated Survivor tables in this browser. ' : ''}Admin-only in production — reads from your ledger.</div>
      <div class="grid2"><div class="card"><div class="sm muted">House profit (5% half)</div><div class="mono green" style="font-size:22px;font-weight:800">${money(T.profitTotal)}</div><div class="xs muted">retained cash ${money(T.cash)}</div></div><div class="card"><div class="sm muted">Credits paid back (5% half)</div><div class="mono gold" style="font-size:22px;font-weight:800">${money(T.creditsPaid)}</div><div class="xs muted">rakeback to eliminated players</div></div></div>
      <div class="kv mt"><span>Rounds resolved</span><b>${T.rounds}</b></div><div class="kv"><span>Volume staked</span><b>${money(T.volume)}</b></div><div class="kv"><span>Fees collected (10% of forfeits)</span><b>${money(T.fees)}</b></div><div class="kv"><span>Private table fees</span><b>${money(T.createFees)}</b></div>
      <div class="card mt2"><div class="card-title"><span>🤖 Liquidity providers</span><span class="tag ${T.lpBankroll >= 1 ? 'gold' : ''}">${T.lpBankroll >= 1 ? 'online' : 'offline — no bankroll yet'}</span></div>
        <div class="kv"><span>Bankroll (live)</span><b>${money(T.lpBankroll)}</b></div><div class="kv"><span>Funded from profit · ${Math.round(S.lp.fundShare * 100)}% above ${money(reserve)} reserve</span><b>${money(T.lpFunded)} / ${money(target)}</b></div><div class="kv"><span>LP P&amp;L</span><b class="${pnl >= 0 ? 'green' : 'red'}">${money(pnl, true)}</b></div><div class="kv"><span>Seats played · W / L</span><b>${T.lpSeats} · ${T.lpWins} / ${T.lpLosses}</b></div>
        <div class="xs muted mt">LPs only sit at ≤ ${money(S.lp.maxStake)} tables, seed ${Math.round(S.lp.seedShare * 100)}% of them, never take the last seat, are tagged <b>LP</b> at the table and play by the same commit-reveal RNG as everyone. An LP that wins ${S.lp.maxWinStreak} in a row is benched for a while. Bankroll is recycled profit — never fresh capital.</div></div>
      <div class="xs muted mt2">Cash-flow priority: infra → ${money(reserve)} reserve → LP seed fund → your take. Flip <span class="mono">SURVIVOR.lp</span> in the config to tune it.</div>`;
  },

  /* limits */
  modal_limits() { const L = state.limits; return `<h3>Play responsibly</h3><div class="sub">Hard daily deposit cap, or take a break. Tightening applies instantly; loosening waits 24 hours.</div><div class="field"><label class="lbl">Daily deposit limit ($, 0 = none)</label><input class="input mono" id="limDaily" type="number" min="0" value="${L.dailyDeposit}"></div><button class="btn primary wide" id="limSave">Save limit</button><div class="card mt2"><b>Take a break</b><div class="sm muted" style="margin-top:4px">Blocks betting and deposits for the whole period. Cannot be undone early.</div><div class="row mt" style="gap:8px">${[['24 hours', 864e5], ['7 days', 7 * 864e5], ['30 days', 30 * 864e5]].map(([l, ms]) => `<button class="btn wide" data-break="${ms}">${l}</button>`).join('')}</div></div>${L.breakUntil > Date.now() ? `<div class="sm red mt">Break active until ${new Date(L.breakUntil).toLocaleString()}</div>` : ''}<div class="xs muted mt2">18+ only. If it stops being fun, stop. Help: begambleaware.org · 1-800-GAMBLER (US).</div>`; },
  bind_limits() {
    $('#limSave').onclick = () => { const v = Math.max(0, +$('#limDaily').value || 0), cur = state.limits.dailyDeposit; if (cur > 0 && (v === 0 || v > cur)) { state.limits.pendingDaily = { v, at: Date.now() + 864e5 }; Notify.toast({ icon: '⏳', title: 'Limit increase scheduled', body: 'Takes effect in 24 hours.' }); } else { state.limits.dailyDeposit = v; Notify.toast({ icon: '✅', title: v ? `Daily deposit limit set: ${money(v)}` : 'Deposit limit removed' }); } save(); this.closeModal(); };
    $$('[data-break]').forEach(b => b.onclick = () => { if (!confirm('Pause betting and deposits for this period? This cannot be undone early.')) return; state.limits.breakUntil = Date.now() + +b.dataset.break; save(); this.closeModal(); this.closeGame(); this.render(); Notify.toast({ icon: '⏸', title: 'Break started', body: 'See you when it ends.' }); });
  },
};

UI.init();
</script>
</body>
</html>
