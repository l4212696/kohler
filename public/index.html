<style>
/* home */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:22px;align-items:stretch;margin-bottom:26px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero-copy{padding:10px 0 4px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero-copy h1{font-size:clamp(30px,4vw,48px);max-width:16ch}
.hero-copy p{color:var(--muted);font-size:16.5px;max-width:46ch}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:16px;background:var(--ink-1);border:1px solid var(--line);max-width:520px}
.search:focus-within{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(0,255,102,.14)}
.search svg{flex:0 0 18px;color:var(--muted)}
.search input{border:0;background:transparent;height:100%;padding:0;box-shadow:none!important}

.live{position:relative;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;padding:20px;border-radius:var(--r-lg);overflow:hidden;
  background:radial-gradient(420px 260px at 0% 0%,rgba(0,255,102,.14),transparent 70%),radial-gradient(420px 260px at 100% 100%,rgba(232,196,106,.12),transparent 70%),var(--ink-1);border:1px solid rgba(232,196,106,.45)}
.live:hover{border-color:rgba(232,196,106,.8)}
.live .ring{position:relative;width:150px;height:150px}
.live .ring svg{position:absolute;inset:0}
.live .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.live .ring .pot{font-family:var(--display);font-weight:800;font-size:24px;color:var(--mint);letter-spacing:-.03em}
.live .ring .lbl{font-size:12px;color:var(--muted)}
.live h3{font-size:20px;margin-bottom:4px}
.live .when{font-weight:700;color:var(--gold)}
.live .meta{font-size:13.5px;color:var(--muted);margin-top:8px}
.live .take{margin-top:14px;display:inline-flex;height:40px;align-items:center;padding:0 16px;border-radius:11px;background:linear-gradient(180deg,#3dff8c,#00d955);color:#03140a;font-weight:700}
@media(max-width:520px){.live{grid-template-columns:110px 1fr}.live .ring{width:110px;height:110px}.live .ring .pot{font-size:23px}}

.offer{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;border:1px solid rgba(232,196,106,.45);background:linear-gradient(135deg,rgba(232,196,106,.14),transparent 70%)}
.offer b{color:var(--gold)}.offer span{font-size:13.5px;color:var(--muted)}
.filters{display:flex;gap:16px;align-items:flex-end;margin-bottom:22px;border-bottom:1px solid var(--line)}
/* categories: plain text tabs with an underline, no colour dots */
.cats{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cats button{position:relative;flex:0 0 auto;height:40px;padding:0;color:var(--muted);font-size:14.5px;font-weight:600;letter-spacing:-.005em;transition:color .15s}
.cats button:hover{color:var(--text)}
.cats button sup{margin-left:4px;font-size:10.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.cats button.on{color:var(--text)}
.cats button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--mint)}
.filters select{margin-bottom:6px}
.filters select{width:auto;height:36px;border-radius:999px;padding:0 12px;font-size:13.5px;font-weight:600;background:var(--ink-1)}
.shop{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g{display:flex;flex-direction:column;border-radius:var(--r-md);background:var(--ink-1);border:1px solid var(--line);overflow:hidden;transition:border-color .15s,transform .15s}
.g:hover{border-color:color-mix(in srgb,var(--hue) 60%,var(--line));transform:translateY(-2px)}
.art1{position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--hue) 18%,var(--ink-2))}
/* any logo, any size, fits the square: the image itself, blurred, fills the space around it */
.art1 .bg{position:absolute;inset:-15%;width:130%;height:130%;object-fit:cover;filter:blur(26px) saturate(1.5) brightness(.7);opacity:.9}
.art1 .fg{position:absolute;inset:0;margin:auto;width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 12px 26px rgba(0,0,0,.45))}
.art1.full .fg{width:100%;height:100%;object-fit:cover;filter:none}
.art1.full .bg{display:none}
.art1:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none}
.g-art{border-bottom:1px solid var(--line)}
.flg{display:inline-block;width:20px;height:15px;border-radius:3px;object-fit:cover;vertical-align:-2px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.flg.ww{box-shadow:none;color:var(--sky)}
.g-art .mono-l{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.04em;color:color-mix(in srgb,var(--hue) 75%,#fff)}
.g-art .flag{position:absolute;top:10px;right:10px;z-index:1;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;line-height:1;padding:5px 7px;border-radius:8px;background:rgba(7,9,13,.72);backdrop-filter:blur(6px)}
.g-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.g-name{font-weight:650;font-size:15px;line-height:1.3}
.g-cat{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.g-cat i{display:none}
.g-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.g-price{font-weight:700;font-size:16px}
.g-opts{font-size:12.5px;color:var(--faint)}
.g.soldout .g-price{color:var(--faint);font-weight:600;font-size:14px}

/* games */
.games{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gt{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:168px;padding:18px;border-radius:var(--r-md);overflow:hidden;
  background:radial-gradient(260px 160px at 100% 0%,color-mix(in srgb,var(--hue) 30%,transparent),transparent 70%),var(--ink-1);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.gt:hover{border-color:color-mix(in srgb,var(--hue) 70%,var(--line));transform:translateY(-2px)}
.gt svg{width:38px;height:38px;color:var(--hue)}
.gt h3{font-size:19px;margin-top:18px}
.gt p{font-size:13.5px;color:var(--muted);margin-top:2px}
.gt.feature{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:22px;padding:24px}
.gt.feature h3{margin:0 0 4px;font-size:clamp(22px,3vw,30px)}
.gt.feature .go{margin-left:auto}
@media(max-width:620px){.gt.feature{flex-direction:column;align-items:flex-start}.gt.feature .go{margin-left:0}}

/* product */
.prod{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media(max-width:900px){.prod{grid-template-columns:1fr}}
.prod-art{border-radius:var(--r-lg);width:100%;max-width:440px;border:1px solid var(--line)}
.prod-art .mono-l{font-family:var(--display);font-weight:800;font-size:92px;color:color-mix(in srgb,var(--hue) 75%,#fff)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--ink-0);cursor:pointer;margin-bottom:8px;transition:border-color .12s}
.opt:hover{border-color:var(--line-2)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 18px}
.opt.sel{border-color:var(--cobalt);background:rgba(0,255,102,.06)}
.opt.sel .radio{border:5px solid var(--cobalt)}
.opt .nm{flex:1;font-weight:600}
.opt .stk{font-size:12.5px;color:var(--muted)}
.opt.sold{opacity:.45;cursor:not-allowed}
.sum>div{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:4px 0}
.sum>div.total{color:var(--text);font-weight:700;font-size:18px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}

/* wallet */
.wal{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.wal{grid-template-columns:1fr}}
.balbig{font-family:var(--display);font-weight:800;font-size:clamp(42px,7vw,64px);letter-spacing:-.04em;line-height:1}
.qr{width:150px;height:150px;border-radius:14px;background:#fff;padding:8px;flex:0 0 150px}
.addr{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--ink-0);border:1px solid var(--line);border-radius:12px;padding:12px}
.testpanel{border-color:rgba(255,182,72,.45);background:radial-gradient(420px 220px at 100% 0%,rgba(255,182,72,.14),transparent 70%),var(--ink-1)}
.act .k{font-weight:600}
.act small{display:block;color:var(--faint);font-size:12.5px}

/* game stage */
.stage{position:relative;height:280px;border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(480px 260px at 50% 0%,color-mix(in srgb,var(--hue) 22%,transparent),transparent 70%),var(--ink-1);border:1px solid var(--line)}
.stage .big{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.04em}
.stage .msg{color:var(--muted)}
.stakes{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.pick button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--ink-1);font-weight:650;display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.pick button b{color:var(--muted);font-weight:600}
.pick button.on{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 12%,var(--ink-1))}
.pulse{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.03)}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.orders .o{padding:16px 0;border-bottom:1px solid var(--line)}
.orders .o:last-child{border:0}
.filebanner{background:var(--coral);color:#2a0606;font-weight:650;padding:10px 16px;text-align:center}
.tb-out{background:none;border:0;padding:0;margin-left:6px;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.qrcard{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:8px 8px 10px;box-shadow:0 12px 32px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06)}.qrwrap{position:relative;display:block;line-height:0}.qrwrap>.qrimg{display:block;width:100%;height:auto}.qrwrap>.qrbtc{position:absolute;left:50%;top:50%;width:21%;height:21%;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}.qrfoot{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;line-height:1;color:#0b0f16;letter-spacing:.01em}.qrfoot b{font-weight:800}.qrfoot span{color:#6b7280;font-weight:600}
.gateway{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:56px 18px}
.gateway-card{position:relative;overflow:hidden;width:min(760px,100%);padding:clamp(28px,6vw,72px);text-align:center;border:1px solid rgba(232,196,106,.42);border-radius:28px;background:
  radial-gradient(560px 280px at 15% 0,rgba(0,255,102,.14),transparent 70%),
  radial-gradient(560px 280px at 85% 100%,rgba(232,196,106,.14),transparent 70%),var(--ink-1);box-shadow:var(--shadow)}
.gateway-card:before{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.05);border-radius:20px;pointer-events:none}
.gateway-mark{display:grid;place-items:center;margin-bottom:20px}
.gateway-card h1{max-width:14ch;margin:0 auto 14px}
.gateway-card p{max-width:48ch;margin:0 auto 26px;color:var(--muted);font-size:17px}
.gateway-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.gateway-note{margin-top:22px!important;font-size:12.5px!important;color:var(--faint)!important}
</style>
</head>

<script>
const S = { user: null, store: null, cfg: null, group: null, sel: null, pool: null, livePoll: null };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (c) => (Number(c) < 0 ? '−' : '') + '$' + (Math.abs(Number(c || 0)) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// real flag images (Windows can't draw flag emoji, it shows "US" instead)
const GLOBE = '<svg class="flg ww" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
const flag = (cc) => !cc || cc === 'WW' ? GLOBE : `<img class="flg" src="/assets/flags/${esc(cc.toLowerCase())}.webp" alt="${esc(cc)}" loading="lazy" onerror="this.replaceWith('${esc(cc)}')">`;
let regionNames; try { regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch {}
const countryName = (cc) => !cc || cc === 'WW' ? 'Worldwide' : (regionNames?.of(cc.toUpperCase()) || cc);
// a logo of any shape or size in a square: the logo centred, its own blurred copy behind it.
// Square photos that are big enough fill the frame edge to edge instead.
const artBox = (url, letter, cls = '') => url
  ? `<div class="art1 ${cls}"><img class="bg" src="${esc(url)}" alt="" aria-hidden="true" loading="lazy"><img class="fg" src="${esc(url)}" alt="" loading="lazy"
      onload="if(Math.abs(this.naturalWidth/this.naturalHeight-1)<.06&&this.naturalWidth>=300)this.parentNode.classList.add('full')"
      onerror="this.parentNode.innerHTML='<span class=&quot;mono-l&quot;>${esc(letter)}</span>'"></div>`
  : `<div class="art1 ${cls}"><span class="mono-l">${esc(letter)}</span></div>`;
const HUES = ['--sky', '--mint', '--gold', '--coral', '--violet', '--rose', '--sky'];
const hueOf = (s) => { let h = 0; for (const ch of String(s || 'x')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `var(${HUES[h % HUES.length]})`; };
$('#yr').textContent = new Date().getFullYear();
if (location.protocol === 'file:') $('#fileBanner').classList.remove('hide');

/* feel: small, only on actions */
const buzz = (p) => { try { navigator.vibrate?.(p); } catch {} };
let actx;
function tone(f = 440, d = 0.07, type = 'sine', g = 0.04, when = 0) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const t = actx.currentTime + when, o = actx.createOscillator(), v = actx.createGain();
    o.type = type; o.frequency.value = f; v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v).connect(actx.destination); o.start(t); o.stop(t + d); } catch {}
}
const winSound = () => [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.06, i * 0.08));
const loseSound = () => { tone(300, 0.22, 'sine', 0.05); tone(220, 0.3, 'sine', 0.04, 0.12); };

let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = 'toast on ' + (kind || ''); clearTimeout(toastT); toastT = setTimeout(() => (t.className = 'toast'), 2800); }
function sheet(html) {
  $('#sheetHost').innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;
  $('#sheetHost .sheet').onclick = (e) => { if (e.target.classList.contains('sheet')) closeSheet(); };
  setTimeout(() => $('#sheetHost input')?.focus(), 30);
  return $('#sheetHost .box');
}
const closeSheet = () => ($('#sheetHost').innerHTML = '');
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch('/api' + path, { method: opts.method || 'GET', headers: { 'content-type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
  } catch { throw Object.assign(new Error("Can't reach the Kohler server. Is it running?"), { status: 0 }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || `Request failed (${r.status})`), { status: r.status, data: j });
  return j;
}

let shownBal = null;
function paintUser() {
  const u = S.user, el = $('#bal');
  $('#av').innerHTML = u ? KohlerFace.html(u.username, u.equip, 40, 12) : '?';
  if (u && !KohlerFace.list.length && !S.facesLoading) { S.facesLoading = true; api('/avatars').then((a) => { KohlerFace.set(a.avatars); if (KohlerFace.list.length) $('#av').innerHTML = KohlerFace.html(u.username, u.equip, 40, 12); }).catch(() => {}); }
  $('#av').style.padding = u ? '0' : ''; $('#av').style.overflow = 'hidden';
  if (!u) { el.querySelector('span').textContent = 'Sign in'; el.onclick = (e) => { e.preventDefault(); authSheet(); }; shownBal = null; return; }
  el.onclick = null;
  const to = u.balance, from = shownBal ?? to, t0 = performance.now(); shownBal = to;
  if (from !== to) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  (function s(t) { const k = Math.min(1, (t - t0) / 450); el.querySelector('span').textContent = money(Math.round(from + (to - from) * (1 - (1 - k) ** 3))); if (k < 1) requestAnimationFrame(s); })(t0);
}
async function refreshMe() {
  let me = null;
  try { me = await api('/me'); S.user = me.user; } catch { S.user = null; }
  // your Vault theme and avatar filter follow you into the shop
  const u = S.user;
  if (u?.equip?.filter && u.equipArt?.filter) KohlerFace.filters[u.equip.filter] = u.equipArt.filter;
  const key = u?.equip?.theme || '';
  if (key !== S.themeKey) { S.themeKey = key; window.KohlerTheme?.set(u?.equipArt?.theme || null); }
  paintUser();
  for (const b of me?.newBadges || []) setTimeout(() => toast(`${b.icon} Badge unlocked: ${b.name}`, 'good'), 400);
  return S.user;
}

/* ── auth ── */
function authSheet(mode = 'in', then) {
  const reg = mode === 'up';
  const b = sheet(`

/* the one loud thing on the page: a live Survivor table */
async function paintLive() {
  clearInterval(S.livePoll);
  const slot = $('#liveSlot'); if (!slot) return;
  const load = async () => { try { S.pool = await api('/pool/lobby'); } catch { S.pool = null; } };
  const draw = () => {
    if (!$('#liveSlot')) return;
    const ts = (S.pool?.tables || []).filter((t) => t.round);
    if (!ts.length) { $('#liveSlot').innerHTML = ''; return; }
    const t = [...ts].sort((a, b) => b.round.seats / b.maxSeats - a.round.seats / a.maxSeats || b.maxSeats - a.maxSeats)[0];
    const r = t.round, n = t.maxSeats, L = t.losers || 1, left = n - r.seats;
    const f = t.stake * L, share = Math.floor((f - Math.floor(f * (r.feeBps ?? 1000) / 10000)) / (n - L));
    const dots = Array.from({ length: n }, (_, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n, x = 50 + 43 * Math.cos(a), y = 50 + 43 * Math.sin(a);
      return `<circle cx="${x}" cy="${y}" r="4.6" fill="${i < r.seats ? 'var(--mint)' : 'none'}" stroke="${i < r.seats ? 'none' : 'var(--line-2)'}" stroke-width="1.3" stroke-dasharray="${i < r.seats ? 0 : '2 1.6'}"/>`;
    }).join('');
    const mode = ({ duel: 'Duel', classic: 'Classic', squad: 'Squad', blitz: 'Blitz' })[t.mode] || t.name;
    $('#liveSlot').innerHTML = `<a class="live" href="/casino#/survivor/${t.code}" aria-label="Open ${esc(mode)} in Survivor">
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="33" fill="none" stroke="rgba(232,196,106,.3)" stroke-width="1.4" stroke-dasharray="2 2"/>${dots}</svg>
        <div class="c"><span class="pot num">+${money(share).replace('.00', '')}</span><span class="lbl">per survivor</span></div></div>
      <div><span class="when num">${left === 1 ? 'One seat left' : left + ' seats open'}</span><h3>Survivor · ${esc(mode)} ${money(t.stake).replace('.00', '')}</h3>
        <p class="meta">${r.seats} of ${n} seated</p>
        <span class="take">Take a seat</span></div></a>`;
  };
  await load(); draw();
  S.livePoll = setInterval(async () => { if (!$('#liveSlot')) return clearInterval(S.livePoll); if (!document.hidden) { await load(); draw(); } }, 8000);
}

function settleUi(win, payout, at) {
  const s = $('#stage');
  s.innerHTML = win
    ? `<div style="text-align:center"><div class="big win num">${at ? at.toFixed(2) + '×' : '+' + money(payout)}</div><p class="msg">You won ${money(payout)}</p></div>`
    : `<div style="text-align:center"><div class="big num" style="color:var(--coral)">${at ? at.toFixed(2) + '×' : 'Miss'}</div><p class="msg">Stake ${money(stake)} lost</p></div>`;
  if (win) { winSound(); buzz([10, 25, 10, 25, 40]); s.classList.add('pulse'); } else { loseSound(); buzz([40]); s.classList.add('shake'); }
  setTimeout(() => s.classList.remove('pulse', 'shake'), 600);
  refreshMe();
}
async function playInstant(game, pick) {
  const btn = $('#go'); btn.disabled = true; $('#stage').innerHTML = '<div class="big">…</div>'; buzz(12);
  try { const r = await api('/games/play', { method: 'POST', body: { game, stakeCents: stake, pick } }); await new Promise((x) => setTimeout(x, 450)); settleUi(r.win, r.payout, null); }
  catch (e) { toast(e.message, 'bad'); if (e.status === 402) depositSheet(); $('#stage').innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
  finally { btn.disabled = false; }
}
let crashTimer = null, crashRound = null, cashed = false;
async function startCrash() {
  const btn = $('#go'); btn.disabled = true;
  try {
    const { roundId, startedAt } = await api('/games/crash/start', { method: 'POST', body: { stakeCents: stake } });
    crashRound = roundId; cashed = false; $('#stage').innerHTML = '<div class="big num" id="mult">1.00×</div>';
    btn.textContent = 'Cash out'; btn.className = 'btn money lg wide'; btn.disabled = false; btn.onclick = cashout; buzz(15);
    const t0 = new Date(startedAt).getTime(); let last = 1;
    crashTimer = setInterval(async () => {
      const el = Date.now() - t0, m = Math.exp(0.09 * (el / 1000)); $('#mult').textContent = m.toFixed(2) + '×';
      if (Math.floor(m) > last) { last = Math.floor(m); tone(900, 0.03, 'square', 0.02); }
      if (el > 22000) { clearInterval(crashTimer); await bust(); }
    }, 40);
    refreshMe();
  } catch (e) { toast(e.message, 'bad'); btn.disabled = false; }
}
async function cashout() {
  if (!crashRound || cashed) return; cashed = true; clearInterval(crashTimer); $('#go').disabled = true;
  try { const r = await api('/games/crash/cashout', { method: 'POST', body: { roundId: crashRound } }); settleUi(r.win, r.payout, r.at); } catch (e) { toast(e.message, 'bad'); }
  resetCrash();
}
async function bust() { if (!crashRound) return; const r = await api('/games/crash/bust', { method: 'POST', body: { roundId: crashRound } }).catch(() => ({ at: 1 })); settleUi(false, 0, r.at); resetCrash(); }
function resetCrash() { crashRound = null; const b = $('#go'); if (!b) return; b.disabled = false; b.textContent = 'Launch'; b.className = 'btn go lg wide'; b.onclick = startCrash; refreshMe(); }

    const opt = options[+o.dataset.i]; if (opt.stock === 0) return; S.sel = opt; buzz(6); paint();
  };
  paint(); $('#buy').onclick = buy;
}
async function buy() {
  if (!S.user) return authSheet('in', () => viewGroup(S.group.slug));
  if (!S.sel) return;
  const opt = S.sel, bps = S.user.passUntil ? 0 : (S.store?.feeBps ?? 100), price = Number(opt.price_cents), fee = Math.ceil(price * bps / 10000);
  // confirm first, and ask where to reach the buyer about this order (prefilled with their email)
  const b = sheet(`<h2 style="margin-bottom:4px">Confirm your order</h2>
    <p class="muted" style="margin-bottom:14px">${esc(S.group.name)} · ${esc(opt.name)}</p>
    <div class="sum" style="margin-bottom:14px"><div><span>Price</span><span class="num">${money(price)}</span></div>
      <div><span>Service fee${bps ? ` (${bps / 100}%)` : ' (Kohler Pass: none)'}</span><span class="num">${money(fee)}</span></div>
      <div class="total"><span>Total from your balance</span><span class="num">${money(price + fee)}</span></div></div>
    <label class="field"><span>Where can we reach you about this order?</span><input type="text" id="oc" maxlength="160" value="${esc(S.user.email || '')}" placeholder="Email, or phone with WhatsApp" autocomplete="email"></label>
    <label class="field"><span>Anything we need to deliver it? <span class="muted" style="font-weight:500">(optional)</span></span><textarea id="on" maxlength="300" style="min-height:70px" placeholder="e.g. the country of your account, or the username to top up"></textarea></label>
    <div class="err" id="oe"></div>
    <button class="btn go lg wide" id="opay">Pay ${money(price + fee)}</button>
`);
  b.querySelector('#opay').onclick = async () => {
    const contact = b.querySelector('#oc').value.trim(), note = b.querySelector('#on').value.trim();
    if (contact.length < 5) { b.querySelector('#oe').textContent = 'Add an email or phone number so we can reach you if something goes wrong.'; b.querySelector('#oc').focus(); return; }
    const btn = b.querySelector('#opay'); btn.disabled = true; btn.textContent = 'Paying…';
    try {
      const { order } = await api('/orders', { method: 'POST', body: { productId: opt.id, contact, note } });
      await refreshMe(); winSound(); buzz([12, 30, 12]);
      const d = sheet(`<h2 style="margin-bottom:4px">Paid. Here it is.</h2>
        <p class="muted" style="margin-bottom:16px">${esc(S.group.name)}, ${esc(opt.name)}. Also saved on your Orders page${order.receipt ? ', and we emailed you a copy' : ''}.</p>
        <label class="field"><span>Delivery</span><textarea readonly class="mono" style="min-height:140px">${esc(order.delivery || 'No delivery text was attached to this product.')}</textarea></label>
        <div style="display:flex;gap:10px"><button class="btn go" style="flex:1" id="cp">Copy</button><button class="btn" id="done">Go to orders</button></div>`);
      d.querySelector('#cp').onclick = () => { navigator.clipboard?.writeText(order.delivery || ''); toast('Copied', 'good'); };
      d.querySelector('#done').onclick = () => { closeSheet(); location.hash = '#/orders'; };
    } catch (e) {
      btn.disabled = false; btn.textContent = `Pay ${money(price + fee)}`;
      if (e.status === 402) { closeSheet(); depositSheet(e.data?.need); } else b.querySelector('#oe').textContent = e.message;
    }
  };
}
function depositSheet(need) {

    <button class="btn go lg wide" id="go">Open wallet</button>`);

}

/* ── router ── */
async function route() {
  closeSheet(); clearInterval(crashTimer); crashRound = null; clearInterval(S.livePoll);
  const [p, arg] = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  if (!p) { viewGateway(); return; }
  document.querySelectorAll('#tabs a, #nav a').forEach((a) => a.classList.toggle('on', a.dataset.r === (p === 'play' ? 'games' : p || 'shop')));
  scrollTo(0, 0);
  try {
    if (p === 'g') { viewGateway(); return; }
    else if (p === 'wallet') await viewWallet();
    else if (p === 'games' || p === 'play') { location.replace('/casino'); return; }
    else if (p === 'orders') { viewGateway(); return; }
    else if (p === 'support') await viewSupport();
    else if (p === 'account') await viewAccount();
    else if (p === 'refer') await viewRefer();
    else { viewGateway(); }
  } catch (e) {
    if (e.status === 401) needAuth();
    else $('#view').innerHTML = `<div class="panel" style="max-width:520px;margin:30px auto"><h3>That didn't load</h3><p class="muted" style="margin:6px 0 14px">${esc(e.message)}</p><button class="btn" onclick="route()">Try again</button></div>`;
  }
}
addEventListener('hashchange', route);
(async () => {
  await refreshMe(); route();
  if (S.user) KohlerWithdraw.notices({ api, money, userId: S.user.id, toast: (m) => toast(m, 'good') });
})();
