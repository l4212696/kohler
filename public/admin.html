<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex">
<title>Kohler Control</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/assets/brand.js"></script>
<script src="/assets/avatar.js"></script>
<link rel="stylesheet" href="/assets/ui.css">
<script src="/assets/ui.js" defer></script>
<style>
:root{--obs:#07090d;--slate:#0e131b;--slate2:#151c27;--slate3:#1d2634;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
  --txt:#eef2f8;--dim:#8b96aa;--faint:#5d6779;--gold:#e8c46a;--neon:#00ff66;--rose:#ff4d6d;--sky:#38bdf8;--violet:#a78bfa;
  --side:248px;--display:'Unbounded',ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--obs);color:var(--txt);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}.faint{color:var(--faint)}
.up{color:var(--neon)}.down{color:var(--rose)}.gold{color:var(--gold)}
.hide{display:none!important}

.side{position:fixed;inset:0 auto 0 0;width:var(--side);display:flex;flex-direction:column;gap:2px;padding:18px 12px;background:linear-gradient(180deg,#0b0f15,#080b10);border-right:1px solid var(--line);overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-family:var(--display);font-weight:700;font-size:16px}
.brand small{display:block;font:700 10px Inter;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.navh{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.side a{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;color:var(--dim);font-weight:600;position:relative}
.side a:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.side a.on{color:var(--txt);background:linear-gradient(90deg,rgba(0,255,102,.1),transparent)}
.side a.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.side a .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#241800;font-size:11px;font-weight:800;display:grid;place-items:center}
.side a .badge.red{background:var(--rose);color:#fff}
.side .foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--slate);border:1px solid var(--line);font-size:12.5px}
.ico{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{margin-left:var(--side);padding:26px 30px 60px;max-width:calc(1320px + var(--side))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.04em;margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em;margin:0}
h3{font-size:14px;margin:0}
.sub{color:var(--dim);margin-top:6px}
.burger{display:none}
@media(max-width:900px){
  :root{--side:0px}.side{width:260px;transform:translateX(-105%);transition:transform .2s}body.nav .side{transform:none;box-shadow:20px 0 60px #000}
  main{padding:18px 14px 50px}.burger{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--slate);border:1px solid var(--line);margin-bottom:14px}
}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--slate);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.hl{border-color:rgba(232,196,106,.5);background:radial-gradient(120% 120% at 100% 0,rgba(232,196,106,.08),transparent 60%),var(--slate)}
.card.ok{border-color:rgba(0,255,102,.35)}
.card.bad{border-color:rgba(255,77,109,.5);background:radial-gradient(120% 120% at 100% 0,rgba(255,77,109,.08),transparent 60%),var(--slate)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.kpi .l{font-size:12px;font-weight:600;color:var(--dim)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.04em;margin:6px 0 2px;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--faint)}
.sec{margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:700;font-size:13px;background:var(--slate2);border:1px solid var(--line2);white-space:nowrap}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.45;pointer-events:none}
.btn.neon{background:linear-gradient(180deg,#3dff8c,#00d955);color:#03140a;border-color:transparent}
.btn.gold{background:linear-gradient(180deg,#f3d58a,#c99a35);color:#241800;border-color:transparent}
.btn.red{background:transparent;border-color:rgba(255,77,109,.5);color:var(--rose)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp,select.inp,textarea.inp{height:38px;border-radius:10px;background:var(--obs);border:1px solid var(--line2);padding:0 12px;outline:0;width:100%}
textarea.inp{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:rgba(0,255,102,.55)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:12px;font-weight:600;color:var(--dim)}
.fields{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw b{display:block;font-weight:600}.sw small{color:var(--dim);font-size:12.5px}
.tog{position:relative;width:46px;height:26px;flex:0 0 46px;border-radius:13px;background:var(--slate3);border:1px solid var(--line2);transition:background .15s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#cbd5e1;transition:transform .15s}
.tog.on{background:var(--neon);border-color:transparent}.tog.on:after{transform:translateX(20px);background:#03140a}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl .r{text-align:right}
.scroll{overflow-x:auto}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--dim);white-space:nowrap}
.tag.g{background:rgba(0,255,102,.14);color:var(--neon)}.tag.y{background:rgba(232,196,106,.16);color:var(--gold)}.tag.r{background:rgba(255,77,109,.15);color:#ff8fa3}.tag.b{background:rgba(56,189,248,.14);color:var(--sky)}.tag.v{background:rgba(167,139,250,.16);color:var(--violet)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.user{display:flex;align-items:center;gap:10px}.user svg{flex:0 0 auto}
.empty{padding:30px 10px;text-align:center;color:var(--dim)}

/* chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;height:100%}
.bars .b i{display:block;border-radius:4px 4px 0 0;min-height:2px}
.bars .b i.f{background:var(--gold)}.bars .b i.c{background:var(--neon);border-radius:0}
.bars .b:hover:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:pre;background:var(--slate3);border:1px solid var(--line2);padding:6px 8px;border-radius:8px;font-size:11.5px;z-index:2}
.bars-x{display:flex;gap:6px;margin-top:6px}.bars-x span{flex:1;text-align:center;font-size:10.5px;color:var(--faint)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.split{display:flex;flex-direction:column;gap:8px}
.split .ln{display:flex;align-items:center;gap:10px;font-size:13px}
.split .ln .bar{flex:1;height:8px;border-radius:4px;background:var(--slate3);overflow:hidden}.split .ln .bar i{display:block;height:100%;border-radius:4px}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.alert:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:6px}

.avg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.avg.sm{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.avc{padding:0;overflow:hidden}.avc img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--slate2)}
.avc.rejected{opacity:.45}.avc.pending{border-color:rgba(232,196,106,.5)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;pointer-events:auto}
.modal.on{display:flex}
.modal .box{width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px;border-radius:20px;background:var(--slate);border:1px solid var(--line2);pointer-events:auto}
.modal input,.modal select,.modal textarea{pointer-events:auto;user-select:text;-webkit-user-select:text}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;z-index:80;padding:10px 16px;border-radius:12px;background:var(--slate2);border:1px solid var(--line2);font-weight:600;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:var(--rose)}
.err{color:var(--rose);font-size:13px;min-height:18px}
.loading{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13.5px;margin:0 0 14px}.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--neon);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.card.sk{background:linear-gradient(90deg,var(--slate) 0%,var(--slate2) 50%,var(--slate) 100%);background-size:200% 100%;animation:sk 1.4s ease infinite;opacity:.6}@keyframes sk{to{background-position:-200% 0}}
/* finance (view only): actions are hidden, settings shown but can't be changed */
body.ro #view button:not([data-ro]):not([data-f]):not([data-sh]):not([data-u]):not(.kx-sel):not(.tog),body.ro #mbox button:not([data-ro]):not(.kx-sel):not(.tog){display:none!important}
/* …and no switches, boxes or settings at all: finance only reads */
body.ro .tog,body.ro .sw:has(.tog),body.ro #view label.field:has(input:not([data-ro])),body.ro #view label.field:has(select),body.ro #view label.field:has(textarea),
body.ro #view input:not([data-ro]),body.ro #view select,body.ro #view textarea,body.ro #view .kx-sel,body.ro #mbox input,body.ro #mbox select,body.ro #mbox .kx-sel,
body.ro #view .card:has(#qGamble),body.ro #view .card:has(#auto),body.ro #view .card:has(#rMax),body.ro #view .card:has(#sEn),body.ro #view .card:has(#hAfter),body.ro #view .card:has(#gMin){display:none!important}
body.ro #mbox label.field:has(#adj),body.ro #mbox .sw{display:none}
.robar{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:rgba(232,196,106,.08);border:1px solid rgba(232,196,106,.35);color:var(--gold);font-size:13px;font-weight:600}
body.ro #view [disabled],body.ro #mbox [disabled]{cursor:not-allowed}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{width:100%;max-width:380px;padding:26px}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<main id="main"><button class="burger" id="burger" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div id="view"></div></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (c) => (Number(c) < 0 ? '−' : '') + '$' + (Math.abs(Number(c || 0)) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = (c) => { const v = Math.abs(Number(c || 0)) / 100, s = Number(c) < 0 ? '−' : ''; return s + '$' + (v >= 10000 ? (v / 1000).toFixed(1) + 'k' : v.toLocaleString('en-US', { maximumFractionDigits: v >= 100 ? 0 : 2 })); };
const ago = (t) => { if (!t) return '—'; const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; };
const when = (t) => t ? new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
let tT; const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(tT); tT = setTimeout(() => (t.className = 'toast'), 2600); };
// GETs retry through cold starts and brief outages; a slow call gives up after 25s with a clear
// message instead of leaving a blank page. A view's data that arrives after you've moved to another
// tab is dropped (the promise never settles), so an old view can't paint over the new one.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function api(p, o = {}) {
  const method = o.method || 'GET', seq = A.seq, read = method === 'GET';
  const stale = () => read && !o.keep && seq !== A.seq;
  for (let attempt = 0; ; attempt++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), o.timeout || 25000);
    let r, text = '';
    try {
      r = await fetch('/api' + p, { method, headers: { 'content-type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined, credentials: 'same-origin', signal: ctl.signal });
      text = await r.text();
    } catch (e) {
      clearTimeout(timer);
      if (stale()) return new Promise(() => {});
      if (read && attempt < 2) { await sleep(900 * (attempt + 1)); continue; }
      throw Object.assign(new Error(e.name === 'AbortError' ? 'Kohler took too long to answer. Try again.' : "Couldn't reach Kohler. Check your connection and try again."), { status: 0 });
    }
    clearTimeout(timer);
    if (stale()) return new Promise(() => {});
    if (read && [502, 503, 504].includes(r.status) && attempt < 3) { await sleep(1200 * (attempt + 1)); continue; }
    let j = {}; try { j = text ? JSON.parse(text) : {}; } catch {}
    if (r.status === 403 && j.need2fa && !o.quiet) setTimeout(() => twoFactor(j.need2fa), 0);
    if (!r.ok) {
      const msg = j.error || (/FUNCTION_INVOCATION_TIMEOUT/.test(text) ? 'The server ran out of time on that one (hosting limit). Try again.'
        : r.status === 503 ? 'Kohler is still starting up. Try again in a few seconds.' : r.status === 401 ? 'Your session ended. Sign in again.' : `Server error (${r.status}). Try again.`);
      throw Object.assign(new Error(msg), { status: r.status, need2fa: j.need2fa });
    }
    return j;
  }
}
// optional parts of a page: if one fails the rest still shows, with a note saying what's missing
const opt = (p, label) => api(p).catch((e) => { if (e.need2fa) throw e; A.miss.push(label); return null; });
const I = (d) => `<svg class="ico" viewBox="0 0 24 24">${d}</svg>`;
const ICO = {
  overview: I('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
  payouts: I('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>'),
  deposits: I('<path d="M12 21V9M7 14l5-5 5 5"/><path d="M4 3h16"/>'),
  users: I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>'),
  survivor: I('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.6"/><circle cx="19" cy="15" r="1.6"/><circle cx="5" cy="15" r="1.6"/><path d="M10 10l4 4M14 10l-4 4"/>'),
  casino: I('<rect x="3" y="5" width="15" height="14" rx="2.5"/><path d="M7.5 9v6M10.5 9v6M13.5 9v6M18 9h2a1 1 0 0 1 1 1v3"/>'),
  vault: I('<path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l3 6 3-6M12 21 9 9M12 21l3-12"/>'),
  catalog: I('<path d="M4 7h16l-1.2 11.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/>'),
  orders: I('<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/>'),
  support: I('<path d="M4 5h16v11H9l-5 4z"/>'),
  avatars: I('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="10" r="3.5"/><path d="M6.5 19a6 6 0 0 1 11 0"/>'),
  promos: I('<path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><rect x="2.5" y="7" width="19" height="5" rx="1"/><path d="M12 7v14M12 7S10.5 3 8 3a2 2 0 0 0 0 4h4zM12 7s1.5-4 4-4a2 2 0 0 1 0 4h-4z"/>'),
  system: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'),
};
const NAV = [['Run the business', [['overview', 'Overview'], ['payouts', 'Payouts'], ['deposits', 'Deposits'], ['users', 'Players'], ['promos', 'Promos']]],
  ['Games', [['survivor', 'Survivor'], ['casino', 'Casino'], ['avatars', 'Avatar factory'], ['vault', 'Vault sales']]],
  ['Shop', [['catalog', 'Catalog'], ['orders', 'Orders'], ['support', 'Support']]],
  ['Platform', [['system', 'Switches & health']]]];
const A = { me: null, stats: null, tab: 'overview', seq: 0, miss: [] };
const god = () => A.me?.adminRole === 'god';
// finance: sees the money pages, read-only, no player emails (the server enforces both)
const fin = () => A.me?.adminRole === 'finance';
const FIN_NAV = [['Money', [['overview', 'Overview'], ['payouts', 'Payouts'], ['deposits', 'Deposits'], ['orders', 'Orders'], ['users', 'Players'], ['promos', 'Promos']]],
  ['Game books', [['survivor', 'Survivor'], ['casino', 'Casino'], ['vault', 'Vault sales']]]];
const canSee = (tab) => god() || (fin() ? FIN_NAV.some(([, items]) => items.some(([k]) => k === tab)) : tab === 'catalog');
const home = () => (god() || fin() ? 'overview' : 'catalog');
// finance is read-only: every box, switch and dropdown on the page is disabled (not just hidden),
// so nothing can be typed, toggled or picked, and the server refuses any change anyway
function lockView() {
  if (!fin()) return;
  document.querySelectorAll('#view input:not([data-ro]), #view select, #view textarea, #view .tog, #view .kx-sel, #mbox input, #mbox select, #mbox textarea, #mbox .tog, #mbox .kx-sel')
    .forEach((el) => { if (el.disabled) return; el.disabled = true; el.readOnly = true; el.tabIndex = -1; el.setAttribute('aria-disabled', 'true'); });   // only once per element (no loop with the dropdown painter)
}
new MutationObserver(() => lockView()).observe(document.body, { childList: true, subtree: true });

function side() {
  const o = A.stats?.ops || {};
  const badge = { payouts: o.payouts_pending + o.payouts_processing, deposits: o.claims_pending, support: A.stats?.open_tickets, system: o.alerts_24h, avatars: o.avatars_pending };

}
function modal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('on'); }
const close = () => $('#modal').classList.remove('on');
$('#modal').onclick = (e) => { if (e.target.id === 'modal') close(); };
function ask(title, body, label, cls = 'neon') {
  return new Promise((res) => { modal(`<h2 style="margin-bottom:8px">${title}</h2><div class="muted" style="margin-bottom:16px">${body}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mNo">Cancel</button><button class="btn ${cls}" id="mYes">${label}</button></div>`);
    $('#mNo').onclick = () => { close(); res(false); }; $('#mYes').onclick = () => { close(); res(true); }; });
}
const tog = (id, on) => `<button class="tog ${on ? 'on' : ''}" id="${id}" role="switch" aria-checked="${!!on}"></button>`;
const sw = (id, on, title, sub) => `<div class="sw"><div><b>${title}</b><small>${sub}</small></div>${tog(id, on)}</div>`;
const who = (name) => `<span class="user">${KohlerAvatar(name || '?', { size: 26 })}<b style="font-weight:600">${esc(name || 'deleted')}</b></span>`;
function bindTog(id, fn) { const b = $('#' + id); if (!b) return; b.onclick = async () => { const on = !b.classList.contains('on'); b.disabled = true; try { await fn(on); b.classList.toggle('on', on); toast('Saved'); } catch (e) { toast(e.message, true); } b.disabled = false; }; }

      ${filter === 'pending' && p.pending ? '<button class="btn neon" id="aAll">Approve all</button>' : ''}</div>
    <div class="avg">${d.avatars.length ? d.avatars.map((a) => `<div class="card avc ${a.status}">

      : `<div class="card empty" style="grid-column:1/-1">${filter === 'pending' ? 'Nothing to review.' : 'No avatars here yet.'}</div>`}</div>

    <div class="avg sm">${d.customs.length ? d.customs.map((a) => `<div class="card avc"><img src="/avatars/${a.id}/128.webp" alt="" loading="lazy"><div style="padding:8px;font-size:12px"><b>${esc(a.username || '')}</b>${a.extra ? `<div class="faint">“${esc(a.extra)}”</div>` : ''}<button class="btn sm red" style="margin-top:6px;width:100%" data-rm="${a.id}">Remove</button></div></div>`).join('')
      : '<div class="card empty" style="grid-column:1/-1">No custom avatars yet.</div>'}</div>`;
  bindTog('aAuto', (on) => api('/admin/avatars/settings', { method: 'PATCH', body: { autoApprove: on } }));
  bindTog('aCus', (on) => api('/admin/avatars/settings', { method: 'PATCH', body: { customEnabled: on } }));
  $('#aSave').onclick = async () => { try { await api('/admin/avatars/settings', { method: 'PATCH', body: { customPrice: Math.round(+$('#aPrice').value * 100), target: +$('#aTarget').value, dailyImages: +$('#aDaily').value } }); toast('Saved'); V.avatars(); } catch (e) { toast(e.message, true); } };
  $('#aStart') && ($('#aStart').onclick = async () => { await api('/admin/avatars/start', { method: 'POST' }); toast('Painting started'); V.avatars(); });
  $('#aPause') && ($('#aPause').onclick = async () => { await api('/admin/avatars/pause', { method: 'POST' }); toast('Paused'); V.avatars(); });
  $('#aRetry') && ($('#aRetry').onclick = async () => { await api('/admin/avatars/retry-failed', { method: 'POST' }); toast('Back in the queue'); V.avatars(); });
  $('#aAll') && ($('#aAll').onclick = async () => { const r = await api('/admin/avatars/approve-all', { method: 'POST' }); toast(`${r.approved} avatars are live`); V.avatars(); });
  $('#aTest') && ($('#aTest').onclick = async () => {
    $('#aTest').disabled = true; $('#aTest').textContent = 'Painting a test pug…';
    try { const r = await api('/admin/avatars/test', { method: 'POST' }); modal(`<h2>It works</h2><p class="muted">Painted in ${(r.ms / 1000).toFixed(1)}s. Test images aren't saved.</p><img src="${r.preview}" alt="" style="width:100%;border-radius:16px;margin:8px 0 14px"><div class="row" style="justify-content:flex-end"><button class="btn neon" onclick="close()">Nice</button></div>`); }
    catch (e) { modal(`<h2>Cloudflare said no</h2><p class="muted">${esc(e.message)}</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="close()">Close</button></div>`); }
    V.avatars();
  });
  // serverless: keep painting in ~25s slices while this page stays open
  clearTimeout(A.avLoop);
  if (d.serverless && (cat.configured || bk) && !s.paused && (p.queued || p.custom_queued) && !A.avBusy) {
    A.avLoop = setTimeout(async () => {
      if (location.hash !== '#/avatars') return;
      A.avBusy = true; const el = $('#aLive'); if (el) el.textContent = '· painting the next batch…';
      let wait = 600;
      try { const r = await api('/admin/avatars/work', { method: 'POST' }); if (r.painted) toast(`${r.painted} new avatar${r.painted === 1 ? '' : 's'} painted`); else wait = 15_000; }
      catch (e) { toast(e.message, true); wait = 15_000; }
      finally { A.avBusy = false; }
      // refresh, but never while you're typing in a box on this page (that wiped what you typed)
      const again = () => { if (location.hash !== '#/avatars') return; const f = document.activeElement; if (f && $('#view').contains(f) && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return setTimeout(again, 3000); V.avatars(); };
      if (location.hash === '#/avatars') setTimeout(again, wait);
    }, 600);
  }
  $('#view').onclick = async (e) => {
    const af = e.target.closest('[data-af]'); if (af) { e.preventDefault(); A.avFilter = af.dataset.af; return V.avatars(); }
    const ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]'), rm = e.target.closest('[data-rm]');
    if (ok || no) { await api('/admin/avatars/' + (ok || no).dataset[ok ? 'ok' : 'no'], { method: 'PATCH', body: { status: ok ? 'approved' : 'rejected' } }); toast(ok ? 'Live' : 'Rejected. A replacement will be painted.'); V.avatars(); }
    if (rm && await ask('Remove this custom avatar?', 'It disappears everywhere and the player goes back to a default avatar. They are not refunded automatically.', 'Remove', 'red')) { await api(`/admin/avatars/custom/${rm.dataset.rm}/remove`, { method: 'POST' }); toast('Removed'); V.avatars(); }
  };
  $('#view').onchange = async (e) => {
    const tr = e.target.closest('[data-tr]'), nm = e.target.closest('[data-nm]');
    if (tr) { await api('/admin/avatars/' + tr.dataset.tr, { method: 'PATCH', body: { tier: tr.value } }); toast('Price updated'); }
    if (nm) { await api('/admin/avatars/' + nm.dataset.nm, { method: 'PATCH', body: { name: nm.value } }); toast('Renamed'); }
  };
};

    $('#tl').innerHTML = ts.length ? ts.map((t) => `<div class="card" style="margin-bottom:10px"><div class="card-h"><div><b>${esc(t.subject)}</b><div class="faint" style="font-size:12px">${esc(t.username || t.name)} · ${esc(t.contact)} · ${ago(t.created_at)}</div></div>${t.status === 'open' ? '<span class="tag y">open</span>' : '<span class="tag">closed</span>'}</div>

      ${messages.filter((m) => m.ticket_id === t.id).map((m) => `<div style="padding:8px 12px;border-radius:10px;margin-bottom:6px;background:${m.from_admin ? 'rgba(0,255,102,.07)' : 'var(--slate2)'}"><b style="font-size:12px;color:${m.from_admin ? 'var(--neon)' : 'var(--dim)'}">${m.from_admin ? 'Kohler' : 'Player'}</b><div style="white-space:pre-wrap">${esc(m.body)}</div></div>`).join('')}
      <div class="row" style="flex-wrap:nowrap;margin-top:8px"><input class="inp" placeholder="Write a reply" data-rin="${t.id}"><button class="btn neon" data-rep="${t.id}">Send</button><button class="btn" data-st="${t.id}" data-to="${t.status === 'open' ? 'closed' : 'open'}">${t.status === 'open' ? 'Close' : 'Reopen'}</button></div></div>`).join('') : '<div class="card empty">Nothing here.</div>';
  };
  $('#view').innerHTML = `<div class="top"><div><h1>Support</h1><div class="sub">Players see your replies on their Help page.</div></div><div class="row">${['open', 'closed', 'all'].map((x) => `<button class="btn sm ${x === show ? 'neon' : ''}" data-sh="${x}">${x}</button>`).join('')}</div></div><div id="tl"></div>`;
  paint();
  $('#view').onclick = async (e) => {
    const sh = e.target.closest('[data-sh]'), rep = e.target.closest('[data-rep]'), stb = e.target.closest('[data-st]');
    if (sh) { show = sh.dataset.sh; document.querySelectorAll('[data-sh]').forEach((x) => x.classList.toggle('neon', x === sh)); paint(); }

    if (stb) { await api(`/admin/tickets/${stb.dataset.st}`, { method: 'PATCH', body: { status: stb.dataset.to } }); V.support(); }
  };
};

  const sum = (p) => { const c = p.config; return p.kind === 'deposit_match'
      ? `${c.firstOnly ? 'First deposit' : 'One deposit per player'}${c.minDeposit ? ` of ${money(c.minDeposit)}+` : ''} matched ${c.pct}% up to ${money(c.cap)}`
      : p.kind === 'referral' ? `Friend deposits ${money(c.minDeposit)}+ → friend gets ${money(c.friendReward)}; referrer gets ${money(c.referrerReward)}${c.friendWager ? ` after the friend bets ${money(c.friendWager)}` : ''}${c.maxPerReferrer ? ` · max ${c.maxPerReferrer} per referrer` : ''}`
      : `Every ${c.every} active friends → ${money(c.reward)}`; };
  $('#view').innerHTML = `<div class="top"><div><h1>Promos</h1><div class="sub">Bonus money for deposits and referrals. Every live promo applies, and each payment happens once. Bonus money is locked until it's been played the number of times you set.</div></div><button class="btn neon" id="pNew">New promo</button></div>
    <div class="grid g4">
      <div class="card kpi"><div class="l">Bonus given, 30 days</div><div class="v num">${money(st.granted30)}</div></div>
      <div class="card kpi"><div class="l">Still locked in balances</div><div class="v num">${money(st.lockedNow)}</div></div>
      <div class="card kpi"><div class="l">Referred players</div><div class="v num">${st.referred}</div><div class="s faint">${st.active} deposited</div></div>
      <div class="card kpi"><div class="l">Held for review</div><div class="v num ${st.held ? 'gold' : ''}">${st.held}</div><div class="s faint">same network as referrer</div></div></div>
    <div class="sec"><h2>Your promos</h2></div>
    <div class="stack" style="display:grid;gap:12px">${d.promos.length ? d.promos.map((p) => { const [t, col] = status(p); return `<div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:240px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:15.5px">${esc(p.name)}</b><span class="tag">${esc(K[p.kind]?.label || p.kind)}</span><span class="tag" style="color:${col}">${esc(t)}</span></div>
        <div class="muted" style="font-size:13.5px;margin-top:4px">${sum(p)} · bonus played ${p.config.wagerX}×</div>
        <div class="faint" style="font-size:12.5px;margin-top:4px">${p.uses} ${p.uses === 1 ? 'payment' : 'payments'} · ${money(p.spent)}${p.budget != null ? ` of ${money(p.budget)} budget` : ' paid'}${p.endsAt ? ` · ends ${when(p.endsAt)}` : ''}</div></div>
      <button class="btn sm" data-edit="${p.id}">Edit</button>${tog('pt' + p.id, p.enabled)}</div>`; }).join('') : '<div class="card empty">No promos yet. Add one to start paying bonuses.</div>'}</div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><div class="card-h"><h2>Referral rules</h2><button class="btn sm neon" id="gSave">Save</button></div>
        <label class="field"><span>A friend counts as "active" once they've deposited ($)</span><input class="inp num" id="gMin" type="number" min="0" step="1" value="${d.general.activeMin / 100}"></label>
        <div class="faint" style="font-size:12.5px;margin:-4px 0 8px">Used by milestone promos and referral badges. Refer-a-friend promos use their own amount.</div>
        ${sw('gNet', d.general.sameNetworkBlock, 'Hold same-network referrals', 'A friend who signs up from the referrer\'s network is probably the same person. Hold them until you release them below.')}</div>
      <div class="card"><div class="card-h"><h2>Top referrers</h2></div>${d.top.length ? d.top.map((t) => `<div class="sw" style="padding:9px 0"><span>${who(t.username)}</span><span class="num faint">${t.active} deposited · ${t.signed} joined${t.held ? ` · <span class="gold">${t.held} held</span>` : ''}</span></div>`).join('') : '<div class="empty">Nobody has referred anyone yet.</div>'}</div></div>
    ${d.held.length ? `<div class="sec"><h2>Held referrals</h2><span class="faint">signed up from the referrer's network</span></div><div class="card">${d.held.map((h) => `<div class="sw" style="padding:9px 0"><span>${who(h.friend)} <span class="faint">invited by</span> <b>${esc(h.referrer)}</b> <span class="faint">· ${ago(h.created_at)}${h.deposited ? ' · has deposited' : ''}</span></span><button class="btn sm" data-rel="${esc(h.friend)}">Release</button></div>`).join('')}</div>` : ''}`;

  const editor = (p) => {
    const kind = p.kind, k = K[kind], c = { ...k.defaults, ...(p.config || {}) };
    const dt = (v) => v ? new Date(new Date(v).getTime() - new Date(v).getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
    const field = ([key, type, label]) => type === 'bool' ? sw('pf_' + key, c[key], label, '')
      : `<label class="field"><span>${esc(label)}</span><input class="inp num" id="pf_${key}" type="number" min="0" step="${type === 'money' ? '0.01' : '1'}" value="${type === 'money' ? c[key] / 100 : c[key]}"></label>`;
    modal(`<h2 style="margin-bottom:4px">${p.id ? 'Edit promo' : 'New promo'}</h2><p class="muted" style="margin:0 0 14px;font-size:13.5px">${esc(k.label)}: ${esc(k.blurb)}</p>
      <label class="field"><span>Name players see</span><input class="inp" id="pf_name" maxlength="60" value="${esc(p.name || k.label)}"></label>
      ${k.fields.filter((f) => f[1] === 'bool').map(field).join('')}
      <div class="fields" style="margin-top:8px">${k.fields.filter((f) => f[1] !== 'bool').map(field).join('')}</div>
      <div class="fields"><label class="field"><span>Starts</span><input class="inp" id="pf_start" type="datetime-local" value="${dt(p.startsAt)}"></label>
        <label class="field"><span>Ends (blank = no end)</span><input class="inp" id="pf_end" type="datetime-local" value="${dt(p.endsAt)}"></label>
        <label class="field"><span>Budget ($, blank = no limit)</span><input class="inp num" id="pf_budget" type="number" min="0" step="1" value="${p.budget != null ? p.budget / 100 : ''}"></label></div>
      <div class="err" id="pf_err"></div>
      <div class="row" style="justify-content:space-between;margin-top:6px">${p.id && !p.uses ? '<button class="btn ghost" id="pfDel" style="color:var(--rose)">Delete</button>' : '<span></span>'}
        <div class="row"><button class="btn ghost" id="pfNo">Cancel</button><button class="btn neon" id="pfYes">${p.id ? 'Save' : 'Create and switch on'}</button></div></div>`);
    $('#pfNo').onclick = close;
    k.fields.filter((f) => f[1] === 'bool').forEach(([key]) => { const b = $('#pf_' + key); b.onclick = () => b.classList.toggle('on'); });
    $('#pfYes').onclick = async () => {
      const config = Object.fromEntries(k.fields.map(([key, type]) => [key, type === 'bool' ? $('#pf_' + key).classList.contains('on') : type === 'money' ? Math.round(+$('#pf_' + key).value * 100) : +$('#pf_' + key).value]));
      const bud = $('#pf_budget').value.trim(), start = $('#pf_start').value, end = $('#pf_end').value;
      const body = { name: $('#pf_name').value, config, budget: bud === '' ? null : Math.round(+bud * 100), endsAt: end ? new Date(end).toISOString() : null, ...(start ? { startsAt: new Date(start).toISOString() } : {}) };
      $('#pfYes').disabled = true;
      try { await api(p.id ? '/admin/promos/' + p.id : '/admin/promos', { method: p.id ? 'PATCH' : 'POST', body: p.id ? body : { ...body, kind } }); close(); toast(p.id ? 'Saved' : 'Promo is live'); V.promos(); }
      catch (e) { $('#pf_err').textContent = e.message; $('#pfYes').disabled = false; }
    };
    $('#pfDel') && ($('#pfDel').onclick = async () => { try { await api('/admin/promos/' + p.id, { method: 'DELETE' }); close(); toast('Deleted'); V.promos(); } catch (e) { $('#pf_err').textContent = e.message; } });
  };
  $('#pNew').onclick = () => {
    modal(`<h2 style="margin-bottom:12px">What kind of promo?</h2><div style="display:grid;gap:10px">${Object.entries(K).map(([key, k]) => `<button class="card" data-kind="${key}" style="text-align:left;cursor:pointer;padding:14px"><b>${esc(k.label)}</b><div class="muted" style="font-size:13px;margin-top:3px">${esc(k.blurb)}</div></button>`).join('')}</div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="pkNo">Cancel</button></div>`);
    $('#pkNo').onclick = close;
    document.querySelectorAll('[data-kind]').forEach((b) => (b.onclick = () => editor({ kind: b.dataset.kind })));
  };
  document.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => editor(d.promos.find((p) => p.id === +b.dataset.edit))));
  d.promos.forEach((p) => bindTog('pt' + p.id, async (on) => { await api('/admin/promos/' + p.id, { method: 'PATCH', body: { enabled: on } }); setTimeout(V.promos, 400); }));
  bindTog('gNet', (on) => api('/admin/promos', { method: 'PATCH', body: { sameNetworkBlock: on } }));
  $('#gSave').onclick = async () => { try { await api('/admin/promos', { method: 'PATCH', body: { activeMin: Math.round(+$('#gMin').value * 100) } }); toast('Saved'); } catch (e) { toast(e.message, true); } };
  document.querySelectorAll('[data-rel]').forEach((b) => (b.onclick = async () => {
    if (!(await ask('Release this referral?', `Do this only if you're sure <b>${esc(b.dataset.rel)}</b> is a different person from who invited them. If they've already deposited enough, the referral bonuses are paid now.`, 'Release'))) return;
    try { const r = await api('/admin/promos/release/' + encodeURIComponent(b.dataset.rel), { method: 'POST' }); toast(r.paid ? `Released. ${money(r.paid)} paid to the referrer.` : 'Released'); V.promos(); } catch (e) { toast(e.message, true); }
  }));
};

V.system = async () => {
  const [set, ap, em, sec] = await Promise.all([api('/admin/settings'), api('/admin/autopilot'), opt('/admin/email', 'Email'), opt('/admin/security', 'Security checklist')]);
  const SECC = { ok: 'var(--neon)', critical: 'var(--rose)', warn: 'var(--gold)', info: 'var(--dim)' };
  const LV = { critical: 'var(--rose)', warn: 'var(--gold)', info: 'var(--dim)' };
  $('#view').innerHTML = `<div class="top"><div><h1>Switches &amp; health</h1><div class="sub">Autopilot checks the books, stuck rounds, payouts and cleanup on its own, at most every 30 minutes while the site has visitors.</div></div><button class="btn neon" id="apRun">Run checks now</button></div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h2>Site</h2></div>${sw('gam', set.gamblingEnabled, 'Games on the site', 'Off hides the casino, Survivor and gambling brands from everyone')}</div>
      <div class="card"><div class="card-h"><h2>Last check</h2><span class="faint">${ago(ap.lastRun)}</span></div>
        ${ap.result ? Object.entries(ap.result.checks).map(([k, v]) => `<div class="sw" style="padding:8px 0"><span>${esc(k)}</span><span class="${v?.ok === false || v?.error ? 'down' : 'up'}" style="font-size:12.5px">${v?.error ? esc(v.error) : v?.ok === false ? 'needs attention' : 'ok'}</span></div>`).join('') : '<div class="empty">Runs within seconds of the first visit.</div>'}</div>
    </div>
    ${sec ? `<div class="card" style="margin-top:14px"><div class="card-h"><h2>Security checklist</h2><span class="faint">${sec.items.filter((i) => i.ok).length} of ${sec.items.length} done</span></div>
      ${sec.items.map((i) => `<div class="alert"><span class="dot" style="background:${SECC[i.level]}"></span><div style="flex:1">${i.ok ? '' : '<b>'}${esc(i.label)}${i.ok ? '' : '</b>'}${i.fix ? `<div class="faint" style="font-size:12.5px">${esc(i.fix)}</div>` : ''}</div></div>`).join('')}</div>` : ''}
    ${em ? `<div class="card" style="margin-top:14px"><div class="card-h"><h2>Email</h2><span class="${!em.keySet || !em.from || em.sandbox || em.lastError ? 'down' : 'up'}" style="font-size:12.5px">${!em.keySet || !em.from ? 'not set up' : em.sandbox ? 'test sender only' : em.lastError && (!em.lastOkAt || new Date(em.lastErrorAt) > new Date(em.lastOkAt)) ? 'failing' : 'ready'}</span></div>
      <div class="sw"><span>Sender (MAIL_FROM)</span><span class="mono">${esc(em.from || 'missing')}</span></div>
      <div class="sw"><span>API key (RESEND_API_KEY)</span><span>${em.keySet ? 'set' : 'missing'}</span></div>
      <div class="sw"><span>New orders go to (ORDER_EMAIL)</span><span class="mono">${esc(em.orderTo || 'not set')}</span></div>
      ${em.sandbox ? `<div class="alert"><span class="dot" style="background:var(--gold)"></span><div style="flex:1">Your sender is Resend's test address. It can only email the address you signed up to Resend with, so receipts, withdrawal emails and sign-in links to players fail. Verify your own domain at <b>resend.com/domains</b> and set MAIL_FROM to e.g. <span class="mono">Kohler &lt;hello@yourdomain.com&gt;</span>.</div></div>` : ''}
      ${em.lastError ? `<div class="alert"><span class="dot" style="background:var(--rose)"></span><div style="flex:1">${esc(em.lastError)}<div class="faint" style="font-size:12px">last failure ${when(em.lastErrorAt)}${em.lastOkAt ? ` · last success ${when(em.lastOkAt)}` : ''}</div></div></div>` : ''}
      <div class="row" style="margin-top:12px"><input class="inp" id="emTo" placeholder="send a test to…" value="${esc(A.me.email || '')}" style="flex:1"><button class="btn" id="emGo">Send test email</button></div></div>` : ''}
    <div class="sec"><h2>Alerts</h2><span class="faint">last 30</span></div>
    <div class="card">${ap.alerts.length ? ap.alerts.map((x) => `<div class="alert"><span class="dot" style="background:${LV[x.detail?.level] || 'var(--gold)'}"></span><div style="flex:1">${esc(x.detail?.message || x.action)}<div class="faint" style="font-size:12px">${when(x.created_at)} · ${esc(x.action.replace('alert.', ''))}</div></div></div>`).join('') : '<div class="empty">No alerts. Everything checked out.</div>'}</div>`;
  bindTog('gam', (on) => api('/admin/settings', { method: 'PATCH', body: { gamblingEnabled: on } }));
  $('#emGo') && ($('#emGo').onclick = async () => {
    $('#emGo').disabled = true; $('#emGo').textContent = 'Sending…';
    try { await api('/admin/email/test', { method: 'POST', body: { to: $('#emTo').value } }); toast('Sent. Check that inbox (and spam).'); }
    catch (e) { modal(`<h2>The email didn't send</h2><p class="muted">${esc(e.message)}</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="close()">Close</button></div>`); }
    V.system();
  });
  $('#apRun').onclick = async () => { $('#apRun').disabled = true; await api('/admin/autopilot/run', { method: 'POST' }).catch((e) => toast(e.message, true)); toast('Checks done'); V.system(); };
};

/* ═════════ two-factor sign-in ═════════ */
function twoFactor(mode) {
  if (A.tfOpen === mode) return; A.tfOpen = mode; A.me = null; A.seq++;
  $('#side').classList.add('hide'); $('#main').style.marginLeft = '0';
  const shell = (inner) => `<div class="gate"><div class="card" style="max-width:420px"><div style="margin-bottom:14px">${KohlerLogo.mark(44, true)}</div>${inner}</div></div>`;
  const done = () => { A.tfOpen = null; boot(); };
  const codeForm = (btn) => `<label class="field"><span>6-digit code</span><input class="inp num" id="tfc" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123 456" style="font-size:22px;letter-spacing:.2em;text-align:center"></label><div class="err" id="tfe"></div><button class="btn neon" style="width:100%;height:44px" id="tfb">${btn}</button>`;
  if (mode === 'verify') {
    $('#view').innerHTML = shell(`<h1 style="font-size:22px">Enter your code</h1><p class="muted" style="margin:6px 0 16px">Open your authenticator app and type the 6-digit code for Kohler.</p>${codeForm('Continue')}
      <p class="faint" style="font-size:12.5px;margin:12px 0 0">Lost your phone? Another owner can reset it from Players, or set ADMIN_2FA=off in your environment variables for a moment.</p>`);
    const go = async () => { $('#tfb').disabled = true; try { await api('/auth/2fa/verify', { method: 'POST', body: { code: $('#tfc').value } }); done(); } catch (e) { $('#tfe').textContent = e.message; $('#tfb').disabled = false; $('#tfc').select(); } };
    $('#tfb').onclick = go; $('#tfc').onkeydown = (e) => { if (e.key === 'Enter') go(); }; $('#tfc').focus();
    return;
  }
  $('#view').innerHTML = shell(`<h1 style="font-size:22px">Turn on two-factor sign-in</h1><p class="muted" style="margin:6px 0 16px">Kohler Control moves real money, so admins sign in with a password <b>and</b> a code from an app on their phone (Google Authenticator, 1Password, Authy…).</p>
    <label class="field"><span>Your password</span><input class="inp" id="tfp" type="password" autocomplete="current-password"></label><div class="err" id="tfe"></div><button class="btn neon" style="width:100%;height:44px" id="tfb">Next</button>`);
  $('#tfb').onclick = async () => {
    $('#tfb').disabled = true;
    try {
      const s = await api('/auth/2fa/setup', { method: 'POST', body: { password: $('#tfp').value } });
      $('#view').innerHTML = shell(`<h1 style="font-size:22px">Scan this with your app</h1><p class="muted" style="margin:6px 0 12px">Then type the code it shows.</p>
        <div style="display:grid;place-items:center;margin-bottom:10px"><img src="${s.qr}" alt="QR code" width="200" height="200" style="border-radius:12px;background:#fff;padding:6px"></div>
        <p class="faint" style="font-size:12px;text-align:center;margin:0 0 14px">Can't scan? Enter this key: <span class="mono" style="color:var(--text);word-break:break-all">${esc(s.secret.replace(/(.{4})/g, '$1 ').trim())}</span></p>${codeForm('Turn it on')}`);
      const go = async () => { $('#tfb').disabled = true; try { await api('/auth/2fa/enable', { method: 'POST', body: { code: $('#tfc').value } }); toast('Two-factor sign-in is on'); done(); } catch (e) { $('#tfe').textContent = e.message; $('#tfb').disabled = false; } };
      $('#tfb').onclick = go; $('#tfc').onkeydown = (e) => { if (e.key === 'Enter') go(); }; $('#tfc').focus();
    } catch (e) { $('#tfe').textContent = e.message; $('#tfb').disabled = false; }
  };
  $('#tfp').focus();
}

/* ═════════ shell ═════════ */
function gate(msg) {
  A.me = null; A.seq++;
  $('#side').classList.add('hide'); $('#main').style.marginLeft = '0';
  $('#view').innerHTML = `<div class="gate"><div class="card"><div style="margin-bottom:16px">${KohlerLogo.mark(48, true)}</div><h1 style="font-size:22px">Kohler Control</h1>
    <p class="muted" style="margin:6px 0 18px">${msg || 'Sign in with an admin account.'}</p>
    <form id="lf"><label class="field"><span>Email or username</span><input class="inp" id="lw" required autocomplete="username"></label><label class="field"><span>Password</span><input class="inp" id="lp" type="password" required autocomplete="current-password"></label>
    <div class="err" id="le"></div><button class="btn neon" style="width:100%;height:44px" id="lb">Sign in</button></form></div></div>`;
  $('#lf').onsubmit = async (e) => { e.preventDefault(); $('#lb').disabled = true;
    try { await api('/auth/login', { method: 'POST', body: { who: $('#lw').value, password: $('#lp').value } }); boot(); } catch (err) { $('#le').textContent = err.message; $('#lb').disabled = false; } };
}
async function route() {
  if (!A.me) return;                       // still signing in
  const seq = ++A.seq; A.miss = [];
  document.body.classList.remove('nav');
  A.tab = (location.hash.slice(2) || home());
  if (!V[A.tab] || !canSee(A.tab)) A.tab = home();
  document.body.classList.toggle('ro', fin());
  side(); scrollTo(0, 0);
  $('#view').onclick = $('#view').onchange = null;   // each page sets its own
  $('#view').innerHTML = `<div class="loading"><span class="spin"></span>Loading ${esc((NAV.flatMap((g) => g[1]).find((x) => x[0] === A.tab) || [, ''])[1])}…</div><div class="grid g4">${'<div class="card sk" style="height:110px"></div>'.repeat(4)}</div>`;
  const slow = setTimeout(() => { const l = $('.loading'); if (l && seq === A.seq) l.lastChild.textContent = ' Still loading. The database may be waking up…'; }, 6000);
  try {
    await V[A.tab]();
    if (seq === A.seq && fin()) { $('#view').insertAdjacentHTML('afterbegin', '<div class="robar">View only. Finance accounts can see everything here but can\'t change anything.</div>'); lockView(); }
    if (seq === A.seq && A.miss.length) $('#view').insertAdjacentHTML('afterbegin', `<div class="card" style="border-color:var(--gold);margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1">Some parts of this page didn't load: <b>${esc(A.miss.join(', '))}</b>.</span><button class="btn sm" data-ro onclick="route()">Try again</button></div>`);
  } catch (e) {
    if (seq !== A.seq || e.need2fa) return;
    if (e.status === 401) return boot();
    console.error('[admin]', A.tab, e);
    $('#view').innerHTML = `<div class="card bad"><h2>That didn't load</h2><p class="muted">${esc(e.message)}</p><button class="btn" data-ro onclick="route()">Try again</button></div>`;
  } finally { clearTimeout(slow); }
}
async function boot() {
  let me = null;
  try { me = (await api('/me', { keep: true })).user; }
  catch (e) {
    $('#side').classList.add('hide'); $('#main').style.marginLeft = '0';
    $('#view').innerHTML = `<div class="gate"><div class="card"><h2>Couldn't open Kohler Control</h2><p class="muted" style="margin:8px 0 16px">${esc(e.message)}</p><button class="btn neon" onclick="boot()">Try again</button></div></div>`;
    return;
  }
  if (!me) return gate();
  if (!me.isAdmin) return gate(`You're signed in as ${esc(me.username)}, which isn't an admin. Sign in with an admin account, or run <span class="mono">npm run make-admin -- you@example.com</span> on the server.`);
  const tf = await api('/auth/2fa', { quiet: true, keep: true }).catch(() => null);
  if (tf?.required && !tf.enabled) return twoFactor('setup');
  if (tf?.required && !tf.verified) return twoFactor('verify');
  A.me = me; A.tfOpen = null; $('#side').classList.remove('hide'); $('#main').style.marginLeft = '';
  if (god() || fin()) api('/admin/stats', { keep: true }).then((s) => { A.stats = s; side(); }).catch(() => {});
  route();
}
addEventListener('hashchange', route);
$('#burger').onclick = () => document.body.classList.toggle('nav');
boot();
</script>
